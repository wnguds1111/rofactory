<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO FACTORY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard',system-ui,-apple-system,sans-serif; background:#f0f2f5; color:#0f172a; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }


        /* GNB ?ㅽ??쇱? styles.css?먯꽌 愿由?*/


        /* ?? 而⑦뀒?대꼫 ?? */
        .studio-detail-container { max-width:1400px; margin:40px auto 80px; padding:0 32px; }
        .breadcrumb { margin-bottom:20px; font-size:14px; font-weight:700; color:#64748b; }
        .breadcrumb a { color:#1d4ed8; }
        .breadcrumb a:hover { text-decoration:underline; }

        /* ?? ?뷀뀒??移대뱶 ?? */
        .detail-card { background:#fff; border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,0.03); overflow:hidden; border:1px solid #e2e8f0; }
        .detail-top { display:flex; padding:40px; gap:40px; border-bottom:1px solid #e2e8f0; }
        .dt-left { width:300px; height:300px; border-radius:12px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:100px; box-shadow:0 15px 30px rgba(0,0,0,0.12); flex-shrink:0; }
        .dt-right { flex:1; display:flex; flex-direction:column; }

        /* ?곹깭 諛곗? */
        .dt-status { display:inline-block; padding:6px 14px; border-radius:12px; font-size:13px; font-weight:800; align-self:flex-start; margin-bottom:15px; }
        .s-converting     { background:#fef3c7; color:#92400e; }
        .s-completed-wait { background:#dbeafe; color:#1d4ed8; }
        .s-completed-sale { background:#dcfce7; color:#166534; }
        .s-expired        { background:#f1f5f9; color:#64748b; }
        .s-failed         { background:#fee2e2; color:#991b1b; }

        .dt-category { font-size:14px; font-weight:800; color:#64748b; margin-bottom:5px; }
        .dt-title { font-size:32px; font-weight:900; color:#0f172a; margin-bottom:20px; }

        .dt-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
        .info-box { background:#f8fafc; padding:16px 20px; border-radius:12px; border:1px solid #e2e8f0; }
        .info-label { font-size:12px; font-weight:700; color:#64748b; margin-bottom:4px; }
        .info-val { font-size:18px; font-weight:900; color:#1e293b; }

        .dt-tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:auto; }
        .dt-tag { background:#fff; border:1px solid #cbd5e1; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:800; color:#475569; cursor:pointer; transition:0.2s; }
        .dt-tag:hover { border-color:#1d4ed8; color:#1d4ed8; }

        .dt-actions { display:flex; gap:15px; margin-top:24px; }
        .dt-btn { flex:1; padding:14px; border-radius:12px; font-size:15px; font-weight:800; border:none; cursor:pointer; transition:0.2s; text-align:center; }
        .dt-btn-secondary { background:#f1f5f9; color:#475569; }
        .dt-btn-secondary:hover { background:#e2e8f0; }
        .dt-btn-primary { background:#1d4ed8; color:#fff; }
        .dt-btn-primary:hover { background:#1e40af; transform:translateY(-2px); }
        .dt-btn-danger { background:#fee2e2; color:#991b1b; }
        .dt-btn-danger:hover { background:#fecaca; }

        /* ?? ??꾨씪???? */
        .detail-bottom { padding:40px; }
        .bottom-title { font-size:20px; font-weight:900; color:#0f172a; margin-bottom:30px; display:flex; align-items:center; gap:10px; }
        .bottom-title::before { content:''; width:6px; height:20px; background:#1d4ed8; border-radius:3px; display:block; }
        .timeline { position:relative; padding-left:30px; }
        .timeline::before { content:''; position:absolute; left:6px; top:5px; bottom:0; width:2px; background:#e2e8f0; }
        .tl-item { position:relative; margin-bottom:30px; }
        .tl-item:last-child { margin-bottom:0; }
        .tl-item::before { content:''; position:absolute; left:-30px; top:5px; width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid #cbd5e1; box-shadow:0 0 0 4px #f8fafc; z-index:2; }
        .tl-item.active::before { border-color:#1d4ed8; background:#1d4ed8; box-shadow:0 0 0 4px #eff6ff; }
        .tl-date { font-size:13px; font-weight:700; color:#94a3b8; margin-bottom:5px; }
        .tl-title { font-size:16px; font-weight:900; color:#1e293b; margin-bottom:5px; }
        .tl-desc { font-size:14px; color:#64748b; line-height:1.5; }

        /* ?? ?명꽣 ?? */
        .footer { margin-top:48px; }
        .footer img { width:100%; height:auto; display:block; }

        @media(max-width:1024px) { 
            .detail-top { flex-direction:column; padding:24px; gap:24px; } 
            .dt-left { width:100%; height:320px; } 
            .dt-info-grid { grid-template-columns:1fr 1fr; }
            .dt-title { font-size: 28px; }
            .detail-bottom { padding: 24px; }
        }
        @media(max-width:768px) {
            .dt-left { height: 240px; font-size: 70px; }
            .dt-info-grid { grid-template-columns:1fr; }
            .dt-actions { flex-direction: column; gap: 10px; }
            .dt-btn { width: 100%; }
            .timeline::before { left: 4px; }
            .tl-item::before { width: 12px; height: 12px; left: -26px; }
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-init.js"></script>
</head>
<body>
    <script src="gnb.js"></script>
    <div class="studio-detail-container">
        <div class="breadcrumb">
            <a href="studio_inventory.html">??援щℓ ?묓뭹 愿由?/a> &gt; <span id="bcTitle">援щℓ ?곸꽭</span>
        </div>

        <div class="detail-card">
            <div class="detail-top">
                <div class="dt-left" id="dtThumb">?챷</div>
                <div class="dt-right">
                    <div id="statusBadge" class="dt-status">?곹깭</div>
                    <div class="dt-category">諛쒖옄援?/div>
                    <div id="pageTitle" class="dt-title">?묓뭹紐?/div>

                    <div class="dt-info-grid" id="infoGrid">
                        <!-- JS 濡?梨꾩? -->
                    </div>

                    <div class="dt-tags" id="tagArea">
                        <span class="dt-tag">#?몃젋??/span>
                        <span class="dt-tag">#?붾젮??/span>
                        <button class="dt-tag" id="previewBtn" style="background:#1d4ed8;color:#fff;border-color:#1d4ed8;" onclick="openPreview()">??誘몃━蹂닿린</button>
                    </div>

                    <div id="actionContainer" class="dt-actions"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ?명꽣 (main2 ?숈씪) -->
    <footer class="footer">
        <img src="images/FOOTER.png" alt="Footer">
    </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const status       = p.get('status')       || 'purchased';
    const title        = p.get('title')        || '援щℓ ?곸꽭 ?댁뿭';
    const icon         = p.get('icon')         || '?챷';
    const bg           = p.get('bg')           || '#e2e8f0';
    const buyDate      = p.get('buyDate')      || '??;
    const state        = p.get('state')        || '??;
    const expDate      = p.get('expDate')      || '??;

    // ?? ??댄?쨌?몃꽕????????????????????????????????
    document.getElementById('bcTitle').innerText = title;
    document.getElementById('pageTitle').innerText = title;
    const thumb = document.getElementById('dtThumb');
    thumb.innerText = icon;
    thumb.style.background = bg;
    if(status === 'expired') thumb.style.filter = 'grayscale(1)';

    // ?? ?곹깭 諛곗? ??????????????????????????????????
    const badge = document.getElementById('statusBadge');
    if (status === 'expired') {
        badge.innerText = '?묓뭹 留뚮즺??;
        badge.className = 'dt-status s-expired';
    } else {
        badge.innerText = '援щℓ ?꾨즺';
        badge.className = 'dt-status s-completed-wait';
    }

    // ?? ?뺣낫 洹몃━??????????????????????????????????
    let gridHTML = `
        <div class="info-box">
            <div class="info-label">援щℓ??/div>
            <div class="info-val" style="font-size:15px;">${buyDate}</div>
        </div>`;
    
    if (status === 'expired') {
        gridHTML += `
        <div class="info-box">
            <div class="info-label" style="color:#dc2626;">留뚮즺??/div>
            <div class="info-val" style="font-size:15px;color:#dc2626;">${expDate}</div>
        </div>`;
    } else {
        gridHTML += `
        <div class="info-box">
            <div class="info-label">?멸쾶???곹깭</div>
            <div class="info-val" style="font-size:15px;color:#166534;">${state}</div>
        </div>`;
    }

    document.getElementById('infoGrid').innerHTML = gridHTML;

    // ?? ?≪뀡 踰꾪듉 ??????????????????????????????????
    const acts = document.getElementById('actionContainer');
    if(status !== 'expired'){
        acts.innerHTML = `<button class="dt-btn dt-btn-primary" onclick="alert('?멸쾶???곸슜 ?듭뀡????λ릺?덉뒿?덈떎.')">?멸쾶?꾩뿉 ?곸슜?섍린</button>`;
    } else {
        acts.innerHTML = `<button class="dt-btn dt-btn-secondary" onclick="alert('留뚮즺???묓뭹?낅땲??')">?ъ슜 遺덇?</button>`;
    }
});

</script>
</body>
</html>
