<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL ROZ</title>
    <!-- favicon -->
    <link rel="icon" href="assets/og_img/favicon.ico" type="image/x-icon" />
    <!-- js -->

    <script src="/common/js/swiper.js"></script>
    <!-- css -->
    <link rel="stylesheet" type="text/css" href="/common/css/swiper.min.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/common.min.css" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<body>
    <!-- header -->
    <header class="header-wrap">
        <div class="header-container-gnjoy">
            <div class="logo">
                <a href="./index.html">
                    <img src="assets/images/header/logo-header-light.png" alt="GNJOY">
                </a>
            </div>
            <div class="util">

                    <button class="btn-outline"><span>sign up</span></button>
                    <button class="btn-rounded"><span>login</span></button>

        <div class="header-container-roz">
            <div class="roz-header-inner">

                    <img src="assets/images/header/header-menu-full.webp" alt="">

                        <a class="gnb-dropdown">

                                <img src="assets/images/header/header-dropdown-menu.webp" alt="">
                            </div>
                        </a>  
                    </div>
                </div>

                <!-- Header Logo -->
                <a href="#" class="header-logo">
                    <img src="assets/images/header/roz-logo.webp" alt="Ragnarok">

                <div class="header-download-wrap">
                    <button class="header-btn-download">
                        <img src="assets/images/header/download-header.png" alt="">
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main-wrap">
        <!-- main -->
        <section class="main-contents">
            <div class="inner-layout">
                <div class="main-contents-container">
                    <img src="assets/images/main/main-contents.webp" alt="">

                    <div class="character-wrap">
                        <img src="assets/images/main/main-character.webp" alt="">
                    </div>
                    <!-- Download Button -->
                    <div class="btn-wrap download">
                        <button type="button" class="download-btn">
                            <img src="assets/images/main/download-open.png" alt="버튼 애니메이션" class="video-bg">
                        </button>   
                    </div>
                </div>
            </div>
        </section>

        <!-- digital goods -->
        <section class="digitalgoods-wrap">
            <div class="goods-contents">
                <h1>ROZ DIGITAL GOODS</h1>
            </div>
        </section>
    </main>

    <!-- footer -->
    <footer>
        <div class="footer-top">
            <div class="inner-layout">
                <div class="link-group">
                    <a href="#">
                        <span>Privacy Policy</span>
                    </a>
                    <a href="#">
                        <span>Terms of Service</span>
                    </a>
                    <a href="#">
                        <span>Account Policy</span>
                    </a>
                    <a href="#">
                        <span>Refund Policy</span>
                    </a>
                    <a href="#">

            <div class="inner-layout">
                <div class="bottom-contents">
                    <a href="/index.html">

                    <div class="footer-text">
                        <p class="copyright">© GRAVITY GAME UNITE SDN. BHD. All Rights Reserved.</p>
                        <span class="description">All trademarks used on this website are the property of their respective owners.</span>
                    </div>
                    <div class="footer-sns">
                        <img src="assets/images/footer/footer-sns.webp" alt="">
                    </div>
                </div>
            </div>
        </div>

        <!-- floatin util -->
        <div class="floating-util-container">
            <!-- top btn -->
            <div class="top-btn-wrap">
                <button type="button">
                    <img src="assets/images/footer/btn-top.webp" alt="">
                </button>
            </div>
            <!-- floating meun -->
            <div class="float-menu-wrap">
                <div class="float-contents">
                    <img src="assets/images/footer/float-menu.webp" alt="">
                </div>
            </div>
