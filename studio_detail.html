<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO FACTORY</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard',system-ui,-apple-system,sans-serif; @apply bg-[#f0f2f5] text-slate-900 antialiased; }
        a { text-decoration:none; color:inherit; }

        .studio-layout { @apply flex lg:flex-row flex-col lg:gap-8 gap-[12px] md:gap-[24px] max-w-[1200px] mx-auto mt-10 md:mt-3 px-3 md:px-6 lg:px-10 min-h-[70vh]; }

        /* Sidebar */
        .studio-sidebar { @apply w-full lg:w-[260px] shrink-0 flex flex-col md:flex-row lg:flex-col lg:gap-5 gap-2.5 md:gap-5; }
        .profile-card { @apply bg-white rounded-2xl lg:p-7 p-4 border border-slate-200 lg:flex-none flex items-center md:items-center lg:items-stretch lg:text-center text-left lg:flex-col lg:gap-0 gap-4 md:flex-1 mb-0 md:mb-0 lg:mb-5; }
        .avatar { @apply w-[52px] h-[52px] md:w-[64px] md:h-[64px] lg:w-[72px] lg:h-[72px] rounded-full bg-white mx-0 lg:mx-auto mb-0 lg:mb-3 flex items-center justify-center border-2 border-slate-200 overflow-hidden shrink-0; }
        .avatar img { @apply w-full h-full object-contain rounded-full; }
        .user-info-wrap { @apply flex-1 flex flex-col lg:block md:block items-start; }
        .user-name { @apply text-base md:text-[18px] lg:text-lg font-black mb-1 lg:mb-2 md:mb-2; }
        .user-kp { @apply text-xs lg:text-[13px] font-bold text-slate-500 bg-slate-50 py-2 px-3.5 rounded-xl block mb-1.5 md:mb-2 lg:mb-3 inline-block lg:w-full w-auto md:w-auto; }
        .user-kp span { @apply text-blue-500 font-black text-base; }
        .btn-kp { @apply block w-full lg:w-full w-auto md:w-auto lg:py-[11px] py-[9px] px-3.5 md:px-[20px] lg:px-0 rounded-xl text-xs lg:text-[13px] font-extrabold text-white bg-gradient-to-br from-blue-500 to-blue-900 text-center transition-all hover:opacity-90 hover:-translate-y-px md:inline-block lg:block; }

        /* Nav */
        .studio-nav { @apply bg-white rounded-[14px] lg:rounded-[18px] border border-slate-200 p-[10px] lg:p-3 list-none flex md:flex-wrap lg:flex-nowrap lg:flex-col overflow-x-auto w-full gap-2 md:gap-2; scrollbar-width: none; }
        .studio-nav::-webkit-scrollbar { display:none; }
        .s-nav-item { @apply flex md:flex-1 lg:flex-none items-center justify-center lg:justify-start gap-2.5 py-[10px] px-4 lg:py-[13px] lg:px-4 text-slate-500 font-bold text-[13px] lg:text-[14px] rounded-[10px] cursor-pointer transition-all hover:bg-slate-50 hover:text-slate-800 shrink-0 lg:shrink-0 whitespace-nowrap lg:mb-[4px] mb-0 min-w-0 md:min-w-[140px]; }
        .s-nav-item:last-child { @apply mb-0; }
        .s-nav-item.active { @apply bg-blue-50 text-blue-700; }
        .s-nav-icon { @apply text-[17px]; }

        /* Main Panel */
        .studio-main { @apply flex-1 pb-10 lg:pb-[60px]; }
        .panel-header { @apply flex flex-col md:flex-row justify-between items-start md:items-center mb-4 lg:mb-6 gap-2.5 md:gap-[10px] lg:gap-0; }
        .panel-title { @apply text-[18px] lg:text-[22px] font-black; }
        .btn-register { @apply bg-slate-900 text-white border-none py-[11px] px-[22px] rounded-xl text-[12px] lg:text-[13px] font-extrabold cursor-pointer flex justify-center items-center gap-[4px] lg:gap-[6px] hover:bg-slate-800 w-full md:w-auto whitespace-nowrap; }
        
        .search-bar { @apply mb-4; }
        .search-bar input { @apply w-full lg:max-w-[380px] max-w-full lg:py-[11px] py-[11px] px-[14px] rounded-[10px] border border-slate-200 font-[Pretendard] text-[13px] lg:text-[14px] bg-white focus:outline-none focus:border-blue-500; }
        
        /* Tabs */
        .sub-tabs { @apply flex gap-1 mb-5 bg-white rounded-[14px] border border-slate-200 p-1.5 overflow-x-auto; scrollbar-width:none; }
        .sub-tabs::-webkit-scrollbar { display:none; }
        .sub-tab { @apply flex-1 text-center py-[9px] lg:py-[10px] px-[14px] lg:px-[8px] text-[12px] lg:text-[13px] font-bold text-slate-400 rounded-[10px] cursor-pointer transition-all shrink-0 whitespace-nowrap; }
        .sub-tab.active { @apply bg-blue-700 text-white; }
        .sub-tab:hover:not(.active) { @apply text-slate-800 bg-blue-50; }

        /* Items */
        .item-list { @apply bg-white rounded-[16px] border border-slate-200 overflow-hidden; }
        .item-row { @apply flex flex-wrap md:flex-nowrap items-start md:items-center py-[14px] px-[16px] md:py-[20px] md:px-[24px] border-b border-slate-100 gap-[12px] md:gap-[18px] transition-all cursor-pointer hover:bg-slate-50; }
        .item-row:last-child { @apply border-b-0; }
        .item-thumb { @apply w-[60px] h-[60px] md:w-[76px] md:h-[76px] rounded-[10px] md:rounded-[12px] flex items-center justify-center text-[22px] md:text-[30px] shrink-0; }
        .item-info { @apply flex-1 min-w-0; }
        .item-tag { @apply text-[10px] font-extrabold bg-slate-100 text-slate-600 py-[3px] px-[8px] rounded-[6px] mb-[5px] inline-block; }
        .item-title { @apply text-[14px] md:text-[15px] font-extrabold text-[#0f172a] mb-[5px] leading-snug; }
        .item-meta { @apply text-[11px] md:text-[12px] text-slate-400 flex flex-wrap gap-[6px] md:gap-[12px]; }
        
        .item-status { @apply py-[4px] px-[10px] md:py-[5px] md:px-[13px] rounded-[12px] text-[10px] md:text-[11px] font-extrabold shrink-0; }
        .s-converting     { @apply bg-amber-100 text-amber-800; }
        .s-completed-wait { @apply bg-blue-100 text-blue-700; }
        .s-completed-sale { @apply bg-green-100 text-green-800; }
        .s-expired        { @apply bg-slate-100 text-slate-500; }
        .s-failed         { @apply bg-red-100 text-red-800; }
        
        .item-actions { @apply flex gap-2 w-full md:w-auto mt-0 shrink-0; }
        .btn-action { @apply flex-1 md:flex-none text-center bg-white border border-slate-200 text-slate-600 py-[8px] px-[10px] md:py-[7px] md:px-[14px] rounded-[8px] text-[12px] font-bold cursor-pointer transition-all hover:bg-slate-50 hover:border-slate-300; }
        
        .empty-state { @apply p-[60px] text-center text-slate-400; }
        .empty-icon { @apply text-[44px] mb-[14px] opacity-40; }
        .empty-text { @apply text-[15px] font-bold; }

        .footer { @apply mt-12; }
        .footer img { @apply w-full h-auto block; }

        /* Detail Page Unique Styles */
        .studio-detail-container { @apply max-w-[1000px] mx-auto mt-6 md:mt-10 px-4 md:px-6 lg:px-8 mb-20 min-h-[70vh]; }
        .breadcrumb { @apply text-sm text-slate-500 font-bold mb-5; }
        .breadcrumb a { @apply hover:text-blue-600 transition-colors; }
        .detail-card { @apply bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm; }
        .detail-top { @apply p-6 md:p-10 flex flex-col md:flex-row gap-8 md:gap-12 border-b border-slate-100 items-start; }
        .dt-left { border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 90px; flex-shrink: 0; background: url('images/main_thumb_bg.jpg') center/cover !important; width: 100%; aspect-ratio: 1 / 1; }
        @media (min-width: 768px) { .dt-left { width: 320px; height: 320px; aspect-ratio: unset; font-size: 130px; } }
        .dt-right { @apply flex-1 w-full; }
        .dt-status { @apply inline-block px-3 py-1.5 text-xs font-bold rounded-lg mb-3; }
        .dt-category { @apply text-sm text-blue-600 font-black mb-1; }
        .dt-title { @apply text-2xl md:text-3xl font-black text-slate-900 mb-6; }
        
        .dt-info-grid { @apply grid grid-cols-2 lg:grid-cols-2 gap-4 mb-6; }
        .info-box { @apply bg-slate-50 p-4 rounded-xl border border-slate-100; }
        .info-label { @apply text-xs font-bold text-slate-400 mb-1; }
        .info-val { @apply text-lg font-black text-slate-800; }
        
        .dt-tags { @apply flex flex-wrap gap-2 mb-8; }
        .dt-tag { @apply px-3 py-1.5 bg-slate-100 border border-transparent text-slate-600 text-xs font-bold rounded-lg transition-colors; }
        
        .dt-actions { @apply flex gap-3; }
        .dt-btn { @apply flex-1 md:flex-none px-6 py-3.5 rounded-xl font-black text-[13px] transition-all cursor-pointer; }
        .dt-btn-primary { @apply bg-gray-900 text-white hover:bg-gray-800 border-none; }
        .dt-btn-secondary { @apply bg-slate-100 text-slate-500 hover:bg-slate-200 border-none; }
        .dt-btn-danger { @apply bg-white border border-red-500 text-red-500 hover:bg-red-50; }

        .detail-bottom { @apply p-6 md:p-10 bg-slate-50/50; }
        .bottom-title { @apply text-lg font-black text-slate-800 mb-6; }
        
        .timeline { @apply relative border-l pl-5 md:pl-6 border-slate-200 ml-3; }
        .tl-item { @apply relative pb-8; }
        .tl-item:last-child { @apply pb-0; }
        .tl-item::before { content:''; @apply absolute left-[-26px] md:left-[-30px] top-1 w-[11px] h-[11px] bg-slate-200 rounded-full transition-colors border-2 border-white; }
        .tl-item.active::before { @apply bg-blue-600 w-[13px] h-[13px] left-[-27px] md:left-[-31px]; }
        .tl-date { @apply text-xs font-bold text-slate-400 mb-1; }
        .tl-title { @apply text-sm font-black mb-1; }
        .tl-desc { @apply text-[13px] text-slate-500 leading-relaxed max-w-2xl; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-init.js"></script>
</head>
<body>
    <script src="gnb.js"></script>
    <div class="studio-detail-container">        <div class="detail-card">
            <div class="detail-top">
                <div class="dt-left" id="dtThumb">🪄</div>
                <div class="dt-right">
                    <div id="statusBadge" class="dt-status">상태</div>
                    <div class="dt-category" data-en="Footprint" data-ko="발자국">발자국</div>
                    <div id="pageTitle" class="dt-title">작품명</div>

                    <div class="dt-info-grid" id="infoGrid">
                        <!-- JS 로 채움 -->
                    </div>

                    <div class="dt-tags" id="tagArea">
                        <span class="dt-tag" data-en="#Trendy" data-ko="#트렌디">#트렌디</span>
                        <span class="dt-tag" data-en="#Brilliant" data-ko="#화려한">#화려한</span>
                        <button class="dt-tag" id="previewBtn" style="background:#1d4ed8;color:#fff;border-color:#1d4ed8;" onclick="openPreview()"><span data-en="▶ Preview" data-ko="▶ 미리보기">▶ 미리보기</span></button>
                    </div>

                    <div id="actionContainer" class="dt-actions"></div>
                </div>
            </div>

            <div class="detail-bottom">
                <h3 class="bottom-title" data-en="Asset Conversion Log" data-ko="작품 변환 로그">작품 변환 로그</h3>
                <div id="timelineContainer" class="timeline"></div>
                
                <div style="margin-top:40px; text-align:center;">
                    <a href="studio_myworks.html" class="dt-btn dt-btn-secondary" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; padding:12px 30px; font-size:14px; border-radius:12px;">
                        <span style="font-size:18px;">←</span>
                        <span data-en="Back to List" data-ko="목록으로">목록으로</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- 미리보기 영상 모달 -->
        <div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:9999;align-items:center;justify-content:center;">
            <div style="background:#0f172a;border-radius:12px;padding:28px;max-width:660px;width:90%;position:relative;">
                <button onclick="closePreview()" style="position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700;">✕</button>
                <div style="font-size:14px;font-weight:800;color:#94a3b8;margin-bottom:14px;" id="modalTitle">미리보기 영상</div>
                <!-- 실제 영상 파일이 없으므로 데모 비디오 사용 -->
                <video id="previewVideo" controls autoplay loop style="width:100%;border-radius:12px;background:#1e293b;aspect-ratio:16/9;outline:none;"
                    src="" poster="">
                    <div style="color:#fff;text-align:center;padding:60px 0;">▶ 미리보기 영상 (게임 내 적용 시뮬레이션)</div>
                </video>
                <p style="color:#64748b;font-size:12px;font-weight:600;margin-top:12px;text-align:center;">🎮 인게임 발자국 적용 미리보기 영상입니다. 실제 게임 환경에서 다를 수 있습니다.</p>
            </div>
        </div>
    </div>

    <!-- 푸터 (main2 동일) -->
    <footer class="footer">
        <img src="images/FOOTER.png" alt="Footer">
    </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    const status       = p.get('status')       || 'converting';
    const completedSub = p.get('completedSub') || '';   // 'wait' | 'sale'
    const title        = p.get('title')        || '작품 상세';
    const icon         = p.get('icon')         || '🪄';
    const bg           = p.get('bg')           || '#e2e8f0';
    const price        = p.get('price')        || '—';
    const sales        = parseInt(p.get('sales') || '0');
    let regDate      = p.get('regDate')      || '';
    let pubDate      = p.get('pubDate')      || '';
    const expDate      = p.get('expDate')      || '';
    const failReason   = p.get('failReason')   || '';

    if (status === 'expired' && expDate && (!pubDate || !regDate)) {
        const parts = expDate.split('.');
        if (parts.length === 3) {
            const d = new Date(parts[2], parts[1] - 1, parts[0]);
            d.setDate(d.getDate() - 90);
            const pdd = String(d.getDate()).padStart(2, '0');
            const pmm = String(d.getMonth() + 1).padStart(2, '0');
            const pyyyy = d.getFullYear();
            if (!pubDate) pubDate = `${pdd}.${pmm}.${pyyyy}`;
            
            d.setDate(d.getDate() - 2);
            const rdd = String(d.getDate()).padStart(2, '0');
            const rmm = String(d.getMonth() + 1).padStart(2, '0');
            const ryyyy = d.getFullYear();
            if (!regDate) regDate = `${rdd}.${rmm}.${ryyyy}`;
        }
    }

    // ── 타이틀·썸네일 ──────────────────────────────
    document.getElementById('pageTitle').innerText = title;
    const thumb = document.getElementById('dtThumb');
    thumb.innerText = icon;
    thumb.style.background = "url('images/main_thumb_bg.jpg') center/cover";
    if(status === 'expired') thumb.style.filter = 'grayscale(1)';

    // ── 상태 배지 ──────────────────────────────────
    const badge = document.getElementById('statusBadge');
    const badgeMap = {
        'converting':      { text:'<span data-en="Converting" data-ko="변환 중">변환 중</span>',          cls:'s-converting' },
        'completed_wait':  { text:'<span data-en="Pending" data-ko="판매 대기">판매 대기</span>',         cls:'s-completed-wait' },
        'completed_sale':  { text:'<span data-en="On Sale" data-ko="판매 중">판매 중</span>',          cls:'s-completed-sale' },
        'expired':         { text:'<span data-en="Expired" data-ko="작품 만료">작품 만료</span>',         cls:'s-expired' },
        'failed':          { text:'<span data-en="Failed" data-ko="변환 실패">변환 실패</span>',         cls:'s-failed' },
        'pending':         { text:'<span data-en="Waiting" data-ko="변환 대기">변환 대기</span>',         cls:'s-pending' },
    };
    const compositeKey = status === 'completed'
        ? (completedSub === 'sale' ? 'completed_sale' : 'completed_wait')
        : status;
    const bInfo = badgeMap[compositeKey] || { text:status, cls:'' };
    badge.innerHTML = bInfo.text;
    badge.className = 'dt-status ' + bInfo.cls;

    // ── 정보 그리드 ────────────────────────────────
    const priceDisplay = price === 'FREE'
        ? '<span style="color:#166534;font-weight:900;">FREE</span>'
        : price;

    let gridHTML = `
        <div class="info-box">
            <div class="info-label" data-en="Price" data-ko="가격">가격</div>
            <div class="info-val">${priceDisplay}</div>
        </div>`;

    if(status === 'converting'){
        gridHTML += `
        <div class="info-box">
            <div class="info-label" data-en="Reg Date" data-ko="등록일">등록일</div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>`;
    } else if(status === 'completed'){
        const pubColor = '#1d4ed8';
        const pubLabel = '<span data-en="Sale Start" data-ko="판매 시작일">판매 시작일</span>';
        let expBox = '';
        if (completedSub === 'sale') {
            let expDateStr = '—';
            if (pubDate) {
                const parts = pubDate.split('.');
                if (parts.length === 3) {
                    const d = new Date(parts[2], parts[1] - 1, parts[0]);
                    d.setDate(d.getDate() + 90);
                    const dd = String(d.getDate()).padStart(2, '0');
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const yyyy = d.getFullYear();
                    expDateStr = `${dd}.${mm}.${yyyy}`;
                }
            }
            expBox = `
            <div class="info-box">
                <div class="info-label" data-en="Exp Date" data-ko="만료 예정일">만료 예정일</div>
                <div class="info-val" style="font-size:15px;color:#64748b;">${expDateStr}</div>
            </div>`;
        }
        gridHTML += `
        <div class="info-box">
            <div class="info-label" data-en="Reg Date" data-ko="등록일">등록일</div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label">${pubLabel}</div>
            <div class="info-val" style="font-size:15px;color:${pubColor};">${pubDate||'—'}</div>
        </div>
        ${expBox}`;
    } else if(status === 'expired'){
        const pubLabel = '<span data-en="Sale Start" data-ko="판매 시작일">판매 시작일</span>';
        gridHTML += `
        <div class="info-box">
            <div class="info-label" data-en="Reg Date" data-ko="등록일">등록일</div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label">${pubLabel}</div>
            <div class="info-val" style="font-size:15px;">${pubDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label" data-en="Exp Date" data-ko="만료일">만료일</div>
            <div class="info-val" style="font-size:15px;color:#dc2626;font-weight:900;">${expDate||'—'}</div>
        </div>`;
    } else if(status === 'failed'){
        gridHTML += `
        <div class="info-box">
            <div class="info-label" data-en="Reg Date" data-ko="등록일">등록일</div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>
        <div class="info-box" style="border-color:#fca5a5;background:#fff5f5;">
            <div class="info-label" style="color:#dc2626;" data-en="Fail Reason" data-ko="실패 사유">실패 사유</div>
            <div class="info-val" style="font-size:13px;color:#991b1b;font-weight:700;" data-en="Conversion Failed" data-ko="변환 실패">변환 실패</div>
        </div>`;
    }
    document.getElementById('infoGrid').innerHTML = gridHTML;

    // ── 액션 버튼 ──────────────────────────────────
    const acts = document.getElementById('actionContainer');
    if(status === 'converting' || status === 'pending'){
        acts.innerHTML = `
            <button class="dt-btn dt-btn-secondary" onclick="location.href='edit.html'" data-en="&#x270E; Edit" data-ko="&#x270E; 수정하기">&#x270E; 수정하기</button>
            <button class="dt-btn dt-btn-danger" onclick="if(confirm('작품을 삭제하시겠습니까?')){alert('삭제되었습니다.');location.href='studio_myworks.html';}" data-en="&#x1F5D1; Delete" data-ko="&#x1F5D1; 삭제하기">&#x1F5D1; 삭제하기</button>
        `;
    } else if(status === 'expired'){
        acts.innerHTML = `<div style="width:100%; text-align:center; padding: 14px; background: #f1f5f9; border-radius: 12px; color: #64748b; font-size: 14px; font-weight: 700;" data-en="Automatically deleted 7 days after expiration." data-ko="만료 7일 후 자동 삭제됩니다.">만료 7일 후 자동 삭제됩니다.</div>`;
    } else if(status === 'failed'){
        acts.innerHTML = `<div style="width:100%; text-align:center; padding: 14px; background: #fef2f2; border-radius: 12px; color: #991b1b; font-size: 14px; font-weight: 700;" data-en="Automatically deleted 7 days after conversion failure." data-ko="변환 실패 7일 후 자동 삭제됩니다.">변환 실패 7일 후 자동 삭제됩니다.</div>`;
    } else {
        acts.innerHTML = '';
    }

    // ── 타임라인 ───────────────────────────────────
    // 헬퍼
    const tlItem = (isActive, date, titleText, titleColor, desc) => `
        <div class="tl-item${isActive?' active':''}">
            <div class="tl-date">${date}${isActive?' <span style="color:#1d4ed8;font-size:11px;" data-en="(Current)" data-ko="(현재)">(현재)</span>':''}</div>
            <div class="tl-title" style="color:${titleColor||'#1e293b'};">${titleText}</div>
        </div>`;

    const tReg       = tlItem(false,'10/03/2026 10:00','<span data-en="Initial Registration" data-ko="작품 최초 등록">작품 최초 등록</span>','','<span data-en="Registered via RO Factory." data-ko="RO Factory 폼을 통해 최초로 정보가 등록되었습니다.">RO Factory 폼을 통해 최초로 정보가 등록되었습니다.</span>');
    const tConvert   = tlItem(status==='converting', '13/03/2026 14:00','<span data-en="🔄 Converting" data-ko="🔄 변환 작업 진행 중">🔄 변환 작업 진행 중</span>','#92400e','<span data-en="Simulating file conversion for in-game." data-ko="서버 엔진에서 인게임 적용을 위한 파일 변환 시뮬레이션을 진행하고 있습니다.">서버 엔진에서 인게임 적용을 위한 파일 변환 시뮬레이션을 진행하고 있습니다.</span>');
    const tCompWait  = tlItem(status==='completed'&&completedSub==='wait', '15/03/2026 09:30','<span data-en="✅ Conversion Complete" data-ko="✅ 변환 완료">✅ 변환 완료</span>','#1d4ed8','<span data-en="Conversion finished. Awaiting requested patch date." data-ko="모든 변환이 성공적으로 끝났습니다. 차후 업데이트에서 상점에 순차적으로 등록할 예정입니다.">모든 변환이 성공적으로 끝났습니다. 차후 업데이트에서 상점에 순차적으로 등록할 예정입니다.</span>');
    const tCompSale  = tlItem(status==='completed'&&completedSub==='sale', pubDate?pubDate.replace(/\./g,'/')+' 00:00':'—', '<span data-en="🎉 On Sale" data-ko="🎉 제품 판매 중">🎉 제품 판매 중</span>','#166634','<span data-en="Now available on the open market!" data-ko="오픈 마켓에 정상적으로 등록되어, 현재 유저들이 아이템을 구매하고 있습니다!">오픈 마켓에 정상적으로 등록되어, 현재 유저들이 아이템을 구매하고 있습니다!</span>');
    const tExpired   = tlItem(true, expDate?expDate.replace(/\./g,'/')+' 00:00':'—', '<span data-en="⏹ Expired" data-ko="⏹ 작품 만료됨">⏹ 작품 만료됨</span>','#64748b','<span data-en="Sale period ended." data-ko="판매 기간이 종료되어 마켓 품절 처리되었습니다.">판매 기간이 종료되어 마켓 품절 처리되었습니다.</span>');
    const tFailed    = tlItem(true, '14/03/2026 16:20','<span data-en="❗ Failed" data-ko="❗ 변환 실패">❗ 변환 실패</span>','#991b1b','<span data-en="Pipeline error. Retrying after deletion is possible." data-ko="변환 파이프라인 처리 중 오류가 발생했습니다. (7일 이내 자동 삭제 예정)">변환 파이프라인 처리 중 오류가 발생했습니다. (7일 이내 자동 삭제 예정)</span>');

    let logs = [];
    if(status === 'converting' || status === 'pending'){
        logs = [tConvert, tReg];
    } else if(status === 'completed' && completedSub === 'wait'){
        logs = [tCompWait, tConvert, tReg];
    } else if(status === 'completed' && completedSub === 'sale'){
        logs = [tCompSale, tCompWait, tConvert, tReg];
    } else if(status === 'expired'){
        logs = [tExpired, tCompSale, tCompWait, tConvert, tReg];
    } else if(status === 'failed'){
        logs = [tFailed, tConvert, tReg];
    } else {
        logs = [tReg];
    }
    document.getElementById('timelineContainer').innerHTML = logs.join('');

    if(window.changeLang) window.changeLang(localStorage.getItem('roz_lang') || 'kr');
});

function closePreview(){
    document.getElementById('previewModal').style.display = 'none';
    const vid = document.getElementById('previewVideo');
    vid.pause();
    vid.currentTime = 0;
}

document.getElementById('previewModal').addEventListener('click', function(e){

});

function downloadFoot(itemTitle) {
    const safeTitle = itemTitle.replace(/[^a-zA-Z0-9가-힣\s_-]/g, '').trim().replace(/\s+/g, '_');
    const fileName = safeTitle + '.foot';
    const content = [
        'RO Factory .foot File',
        '====================',
        'Item Name : ' + itemTitle,
        'File Type : .foot',
        'Category  : 발자국',
        'Generated : ' + new Date().toLocaleString('ko-KR'),
        '',
        '[This is a simulated .foot asset file for demo purposes.]',
        '[In production, this would be a binary UGC footprint asset.]',
    ].join('\n');

    // ZIP 시뮬레이션: 아이템명.foot 파일을 포함한 텍스트 다운로드
    const blob = new Blob([content], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safeTitle + '_bundle.zip'; // zip 이름으로 다운
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('📦 ' + itemTitle + ' (.foot) 파일이 압축 다운로드 됩니다.');
}
