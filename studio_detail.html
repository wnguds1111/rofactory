<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세 정보 | RO Factory Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #f1f5f9; color: #0f172a; }
        .studio-detail-container { max-width: 1000px; margin: 40px auto 100px; }
        .breadcrumb { margin-bottom: 20px; font-size: 14px; font-weight: 700; color: #64748b; }
        .breadcrumb a { color: #3b82f6; text-decoration: none; }
        
        .detail-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); overflow: hidden; border: 1px solid #e2e8f0; }
        .detail-top { display: flex; padding: 40px; gap: 40px; border-bottom: 1px solid #e2e8f0; }
        .dt-left { width: 300px; height: 300px; border-radius: 20px; background: linear-gradient(to right, #434343, black); display: flex; align-items: center; justify-content: center; font-size: 100px; box-shadow: 0 15px 30px rgba(0,0,0,0.15); flex-shrink: 0; }
        
        .dt-right { flex: 1; display: flex; flex-direction: column; }
        .dt-status { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 800; background: #e2e8f0; color: #475569; align-self: flex-start; margin-bottom: 15px; }
        .dt-status.completed { background: #e0f2fe; color: #0284c7; }
        .dt-status.onsale { background: #166534; color: #fff; }
        .dt-status.failed { background: #fee2e2; color: #991b1b; }
        .dt-status.expired { background: #f1f5f9; color: #64748b; }
        
        .dt-category { font-size: 14px; font-weight: 800; color: #64748b; margin-bottom: 5px; }
        .dt-title { font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 20px; }
        
        .dt-info-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        .info-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
        .info-label { font-size: 14px; font-weight: 700; color: #64748b; }
        .info-val { font-size: 20px; font-weight: 900; color: #1e293b; }
        
        .dt-tags { display: flex; gap: 8px; margin-bottom: auto; }
        .dt-tag { background: #fff; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #475569; }
        
        .dt-actions { display: flex; gap: 15px; margin-top: 30px; }
        .dt-btn { flex: 1; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
        .dt-btn-secondary { background: #f1f5f9; color: #475569; }
        .dt-btn-secondary:hover { background: #e2e8f0; }
        .dt-btn-primary { background: #0369a1; color: #fff; }
        .dt-btn-primary:hover { background: #075985; transform: translateY(-2px); }
        
        .detail-bottom { padding: 40px; }
        .bottom-title { font-size: 20px; font-weight: 900; color: #0f172a; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .bottom-title::before { content: ''; width: 6px; height: 20px; background: #3b82f6; border-radius: 3px; display: block; }
        
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 6px; top: 5px; bottom: 0; width: 2px; background: #e2e8f0; }
        .tl-item { position: relative; margin-bottom: 30px; }
        .tl-item:last-child { margin-bottom: 0; }
        .tl-item::before { content: ''; position: absolute; left: -30px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #cbd5e1; box-shadow: 0 0 0 4px #f8fafc; z-index: 2; }
        .tl-item.active::before { border-color: #3b82f6; background: #3b82f6; box-shadow: 0 0 0 4px #eff6ff; }
        
        .tl-date { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 5px; }
        .tl-title { font-size: 16px; font-weight: 900; color: #1e293b; margin-bottom: 5px; }
        .tl-desc { font-size: 14px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="gnjoy-topbar">
        <div class="container">
            <div class="gnjoy-logo">
                <img src="images/gnjoy_logo.png" alt="GNJOY">
            </div>
            <div class="gnjoy-links">
                <a href="studio.html" class="btn-login" style="background:transparent; color:#333;">마이 스튜디오 바로가기</a>
            </div>
        </div>
    </div>

    <div class="studio-detail-container">
        <div class="breadcrumb">
            <a href="studio.html">마이 스튜디오</a> > <span id="bcTitle">크리스탈 조각 발자국</span>
        </div>
        
        <div class="detail-card">
            <div class="detail-top">
                <div class="dt-left">💎</div>
                <div class="dt-right" id="detailRightContent">
                    <div id="statusBadge" class="dt-status">변환 대기 중</div>
                    <div class="dt-category">발자국</div>
                    <div id="pageTitle" class="dt-title">크리스탈 조각 발자국</div>
                    
                    <div class="dt-info-grid">
                        <div class="info-box">
                            <div class="info-label" id="priceLabel">가격</div>
                            <div class="info-val"></div>
                        </div>
                    </div>
                    
                    <div class="dt-tags">
                        <span class="dt-tag">발자국</span>
                    </div>
                    
                    <div id="actionContainer" class="dt-actions"></div>
                </div>
            </div>
            
            <div class="detail-bottom">
                <h3 class="bottom-title">작품 변환 로그</h3>
                <div id="timelineContainer" class="timeline"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status') || 'pending';
            const title = params.get('title') || '크리스탈 조각 발자국';
            const icon = params.get('icon') || '💎';
            const bg = params.get('bg') || 'linear-gradient(to right, #e0c3fc, #8ec5fc)';
            let price = params.get('price') || '6,000 KP';
            if (status === 'purchased' || price === '구매 완료') {
                price = '<span style="color:#0ea5e9;">구매 완료</span>';
            } else if (!price.includes('KP') && price !== 'FREE') {
                price = price + ' KP';
            }
            
            document.getElementById('bcTitle').innerText = title;
            document.getElementById('pageTitle').innerText = title;
            
            const dtLeft = document.querySelector('.dt-left');
            if(dtLeft) {
                dtLeft.innerText = icon;
                dtLeft.style.background = bg;
                if(status === 'expired') dtLeft.style.filter = 'grayscale(1)';
            }
            
            const tagsBox = document.querySelector('.dt-tags');
            if(tagsBox) {
                tagsBox.innerHTML = `
                    <span class="dt-tag">#트렌디</span>
                    <span class="dt-tag">#화려한</span>
                    <button class="dt-tag" style="background:#0ea5e9; color:#fff; border-color:#0ea5e9; cursor:pointer; font-weight:900;" onclick="alert('미리보기 영상 재생')">▶ 미리보기 영상보기</button>
                `;
            }
            
            const priceValEl = document.querySelector('.info-val');
            if(priceValEl) {
                priceValEl.innerHTML = price.includes('FREE') ? '<span style="color:#22c55e;">FREE</span>' : price;
            }
            
            if (status === 'purchased') {
                document.getElementById('priceLabel').innerText = '구매 가격';
                document.getElementById('statusBadge').className = 'dt-status completed';
                document.getElementById('statusBadge').innerText = '구매 완료';
                document.getElementById('timelineContainer').innerHTML = `
                    <div class="tl-item active">
                        <div class="tl-date">2026.03.19 14:32</div>
                        <div class="tl-title" style="color:#0ea5e9;">구매 완료</div>
                        <div class="tl-desc">아이템 구매가 성공적으로 완료되어 게임 내 우편함으로 발송되었습니다.</div>
                    </div>`;
                return;
            }

            const badgeMap = {
                'pending': { text: '변환 대기 중', class: '' },
                'converting': { text: '변환 중', class: '' },
                'completed': { text: '변환 완료', class: 'completed' },
                'onsale': { text: '판매 중', class: 'onsale' },
                'expired': { text: '작품 만료', class: 'expired' },
                'failed': { text: '변환 실패', class: 'failed' }
            };
            
            let bInfo = badgeMap[status] || badgeMap['pending'];
            const badge = document.getElementById('statusBadge');
            badge.innerText = bInfo.text;
            badge.className = 'dt-status ' + bInfo.class;

            const acts = document.getElementById('actionContainer');
            if (status === 'pending') {
                acts.innerHTML = `<button class="dt-btn dt-btn-secondary" onclick="alert('삭제되었습니다.'); location.href='studio.html';">삭제하기</button><a href="edit.html" class="dt-btn dt-btn-primary">정보 수정하기</a>`;
                document.getElementById('priceLabel').innerText = '가격';
            } else {
                acts.innerHTML = '';
                document.getElementById('priceLabel').innerText = '가격';
            }

            const tRegister = `<div class="tl-item">
                                    <div class="tl-date">2026.03.11 10:00</div>
                                    <div class="tl-title">작품 최초 등록</div>
                                    <div class="tl-desc">RO Factory 폼을 통해 최초로 정보가 등록되었습니다.</div>
                               </div>`;
            const tPending = `<div class="tl-item ${status==='pending'?'active':''}">
                                    <div class="tl-date">2026.03.11 10:05 ${status==='pending'?'(현재 상태)':''}</div>
                                    <div class="tl-title" style="color:${status==='pending'?'#0ea5e9':'#1e293b'};">변환 대기 중</div>
                                    <div class="tl-desc">파일 변환 대기열에 진입했습니다. (이 단계 정보 수정 가능)</div>
                               </div>`;
            const tConverting = `<div class="tl-item ${status==='converting'?'active':''}">
                                    <div class="tl-date">2026.03.13 14:00 ${status==='converting'?'(현재 상태)':''}</div>
                                    <div class="tl-title" style="color:${status==='converting'?'#854d0e':'#1e293b'};">변환 작업 진행 중</div>
                                    <div class="tl-desc">서버 엔진에서 인게임 적용을 위한 파일 변환 시뮬레이션을 진행하고 있습니다.</div>
                                 </div>`;
            const tCompleted = `<div class="tl-item ${status==='completed'?'active':''}">
                                    <div class="tl-date">2026.03.15 09:30 ${status==='completed'?'(현재 상태)':''}</div>
                                    <div class="tl-title" style="color:${status==='completed'?'#0284c7':'#1e293b'};">변환 완료</div>
                                    <div class="tl-desc">모든 변환이 성공적으로 끝났습니다. 안내된 패치 예정일에 맞춰 출시를 대기합니다.</div>
                               </div>`;
            const tOnSale = `<div class="tl-item ${status==='onsale'?'active':''}">
                                    <div class="tl-date">2026.03.18 10:00 ${status==='onsale'?'(현재 상태)':''}</div>
                                    <div class="tl-title" style="color:${status==='onsale'?'#166534':'#1e293b'};">🎉 제품 판매 중</div>
                                    <div class="tl-desc">오픈 마켓에 정상적으로 등록되어, 현재 유저들이 아이템을 구매하고 있습니다!</div>
                             </div>`;
            const tExpired = `<div class="tl-item active">
                                    <div class="tl-date">2025.10.31 23:59 (현재 상태)</div>
                                    <div class="tl-title" style="color:#64748b;">작품 만료됨</div>
                                    <div class="tl-desc">판매 기간이 종료되어 마켓 품절 처리되었습니다.</div>
                               </div>`;
            const tFailed = `<div class="tl-item active">
                                    <div class="tl-date">2026.03.14 16:20 (현재 상태)</div>
                                    <div class="tl-title" style="color:#991b1b;">❗️ 변환 실패</div>
                                    <div class="tl-desc">변환 대기 상태에서 파일 변환에 실패했습니다. (파일 형식 틀림)</div>
                             </div>`;

            let logs = [];
            
            if (status === 'pending') {
                logs.push(tPending);
                logs.push(tRegister);
            } 
            else if (status === 'converting') {
                logs.push(tConverting);
                logs.push(tPending);
                logs.push(tRegister);
            }
            else if (status === 'completed') {
                logs.push(tCompleted);
                logs.push(tConverting);
                logs.push(tPending);
                logs.push(tRegister);
            }
            else if (status === 'onsale') {
                logs.push(tOnSale);
                logs.push(tCompleted);
                logs.push(tConverting);
                logs.push(tPending);
                logs.push(tRegister);
            }
            else if (status === 'expired') {
                logs.push(tExpired);
                logs.push(tOnSale);
                logs.push(tCompleted);
                logs.push(tConverting);
                logs.push(tPending);
                logs.push(tRegister);
            }
            else if (status === 'failed') {
                logs.push(tFailed);
                logs.push(tPending);
                logs.push(tRegister);
            }

            document.getElementById('timelineContainer').innerHTML = logs.join('');
        });
    </script>


</html>
