<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  | RO Factory Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard',system-ui,-apple-system,sans-serif; background:#f0f2f5; color:#0f172a; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }


        /* GNB Style is styles.cssManaged at */


        /* ──  ── */
        .studio-detail-container { max-width:1400px; margin:40px auto 80px; padding:0 32px; }
        .breadcrumb { margin-bottom:20px; font-size:14px; font-weight:700; color:#64748b; }
        .breadcrumb a { color:#1d4ed8; }
        .breadcrumb a:hover { text-decoration:underline; }

        /* ──   ── */
        .detail-card { background:#fff; border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,0.03); overflow:hidden; border:1px solid #e2e8f0; }
        .detail-top { display:flex; padding:40px; gap:40px; border-bottom:1px solid #e2e8f0; }
        .dt-left { width:300px; height:300px; border-radius:12px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:100px; box-shadow:0 15px 30px rgba(0,0,0,0.12); flex-shrink:0; }
        .dt-right { flex:1; display:flex; flex-direction:column; }

        /* Status  */
        .dt-status { display:inline-block; padding:6px 14px; border-radius:12px; font-size:13px; font-weight:800; align-self:flex-start; margin-bottom:15px; }
        .s-converting     { background:#fef3c7; color:#92400e; }
        .s-completed-wait { background:#dbeafe; color:#1d4ed8; }
        .s-completed-sale { background:#dcfce7; color:#166534; }
        .s-expired        { background:#f1f5f9; color:#64748b; }
        .s-failed         { background:#fee2e2; color:#991b1b; }

        .dt-category { font-size:14px; font-weight:800; color:#64748b; margin-bottom:5px; }
        .dt-title { font-size:32px; font-weight:900; color:#0f172a; margin-bottom:20px; }

        .dt-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
        .info-box { background:#f8fafc; padding:16px 20px; border-radius:12px; border:1px solid #e2e8f0; }
        .info-label { font-size:12px; font-weight:700; color:#64748b; margin-bottom:4px; }
        .info-val { font-size:18px; font-weight:900; color:#1e293b; }

        .dt-tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:auto; }
        .dt-tag { background:#fff; border:1px solid #cbd5e1; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:800; color:#475569; cursor:pointer; transition:0.2s; }
        .dt-tag:hover { border-color:#1d4ed8; color:#1d4ed8; }

        .dt-actions { display:flex; gap:15px; margin-top:24px; }
        .dt-btn { flex:1; padding:14px; border-radius:12px; font-size:15px; font-weight:800; border:none; cursor:pointer; transition:0.2s; text-align:center; }
        .dt-btn-secondary { background:#f1f5f9; color:#475569; }
        .dt-btn-secondary:hover { background:#e2e8f0; }
        .dt-btn-primary { background:#1d4ed8; color:#fff; }
        .dt-btn-primary:hover { background:#1e40af; transform:translateY(-2px); }
        .dt-btn-danger { background:#fee2e2; color:#991b1b; }
        .dt-btn-danger:hover { background:#fecaca; }

        /* ──  ── */
        .detail-bottom { padding:40px; }
        .bottom-title { font-size:20px; font-weight:900; color:#0f172a; margin-bottom:30px; display:flex; align-items:center; gap:10px; }
        .bottom-title::before { content:''; width:6px; height:20px; background:#1d4ed8; border-radius:3px; display:block; }
        .timeline { position:relative; padding-left:30px; }
        .timeline::before { content:''; position:absolute; left:6px; top:5px; bottom:0; width:2px; background:#e2e8f0; }
        .tl-item { position:relative; margin-bottom:30px; }
        .tl-item:last-child { margin-bottom:0; }
        .tl-item::before { content:''; position:absolute; left:-30px; top:5px; width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid #cbd5e1; box-shadow:0 0 0 4px #f8fafc; z-index:2; }
        .tl-item.active::before { border-color:#1d4ed8; background:#1d4ed8; box-shadow:0 0 0 4px #eff6ff; }
        .tl-date { font-size:13px; font-weight:700; color:#94a3b8; margin-bottom:5px; }
        .tl-title { font-size:16px; font-weight:900; color:#1e293b; margin-bottom:5px; }
        .tl-desc { font-size:14px; color:#64748b; line-height:1.5; }

        /* ──  ── */
        .footer { margin-top:48px; }
        .footer img { width:100%; height:auto; display:block; }

        @media(max-width:1024px) { 
            .detail-top { flex-direction:column; padding:24px; gap:24px; } 
            .dt-left { width:100%; height:320px; } 
            .dt-info-grid { grid-template-columns:1fr 1fr; }
            .dt-title { font-size: 28px; }
            .detail-bottom { padding: 24px; }
        }
        @media(max-width:768px) {
            .dt-left { height: 240px; font-size: 70px; }
            .dt-info-grid { grid-template-columns:1fr; }
            .dt-actions { flex-direction: column; gap: 10px; }
            .dt-btn { width: 100%; }
            .timeline::before { left: 4px; }
            .tl-item::before { width: 12px; height: 12px; left: -26px; }
        }
    </style>
</head>
<body>
    <script src="gnb.js"></script>
</div>
<div class="studio-detail-container">
        <div class="breadcrumb">
            <a href="studio_myworks.html">←   </a> &gt; <span id="bcTitle"> </span>
        </div>

        <div class="detail-card">
            <div class="detail-top">
                <div class="dt-left" id="dtThumb">🪄</div>
                <div class="dt-right">
                    <div id="statusBadge" class="dt-status">Status</div>
                    <div class="dt-category"></div>
                    <div id="pageTitle" class="dt-title">Item Name</div>

                    <div class="dt-info-grid" id="infoGrid">
                        <!-- JS   -->
                    </div>

                    <div class="dt-tags" id="tagArea">
                        <span class="dt-tag">#</span>
                        <span class="dt-tag">#</span>
                        <button class="dt-tag" id="previewBtn" style="background:#1d4ed8;color:#fff;border-color:#1d4ed8;" onclick="openPreview()">▶ Preview</button>
                    </div>

                    <div id="actionContainer" class="dt-actions"></div>
                </div>
            </div>

            <div class="detail-bottom">
                <h3 class="bottom-title">  </h3>
                <div id="timelineContainer" class="timeline"></div>
            </div>
        </div>

        <!-- Preview   -->
        <div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:9999;align-items:center;justify-content:center;">
            <div style="background:#0f172a;border-radius:12px;padding:28px;max-width:660px;width:90%;position:relative;">
                <button onclick="closePreview()" style="position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700;">✕</button>
                <div style="font-size:14px;font-weight:800;color:#94a3b8;margin-bottom:14px;" id="modalTitle">Preview </div>
                <!--        -->
                <video id="previewVideo" controls autoplay loop style="width:100%;border-radius:12px;background:#1e293b;aspect-ratio:16/9;outline:none;"
                    src="" poster="">
                    <div style="color:#fff;text-align:center;padding:60px 0;">▶ Preview  (   )</div>
                </video>
                <p style="color:#64748b;font-size:12px;font-weight:600;margin-top:12px;text-align:center;">🎮    Preview .      .</p>
            </div>
        </div>
    </div>

    <!--  (main2 ) -->
    <footer class="footer">
        <img src="images/FOOTER.png" alt="Footer">
    </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    const status       = p.get('status')       || 'converting';
    const completedSub = p.get('completedSub') || '';   // 'wait' | 'sale'
    const title        = p.get('title')        || ' ';
    const icon         = p.get('icon')         || '🪄';
    const bg           = p.get('bg')           || '#e2e8f0';
    const price        = p.get('price')        || '—';
    const sales        = parseInt(p.get('sales') || '0');
    const regDate      = p.get('regDate')      || '';
    const pubDate      = p.get('pubDate')      || '';
    const expDate      = p.get('expDate')      || '';
    const failReason   = p.get('failReason')   || '';

    // ── · ──────────────────────────────
    document.getElementById('bcTitle').innerText = title;
    document.getElementById('pageTitle').innerText = title;
    const thumb = document.getElementById('dtThumb');
    thumb.innerText = icon;
    thumb.style.background = bg;
    if(status === 'expired') thumb.style.filter = 'grayscale(1)';

    // ── Status  ──────────────────────────────────
    const badge = document.getElementById('statusBadge');
    const badgeMap = {
        'converting':      { text:' ',   cls:'s-converting' },
        'completed_wait':  { text:' ', cls:'s-completed-wait' },
        'completed_sale':  { text:' ',   cls:'s-completed-sale' },
        'expired':         { text:' ', cls:'s-expired' },
        'failed':          { text:'Failed', cls:'s-failed' },
    };
    const compositeKey = status === 'completed'
        ? (completedSub === 'sale' ? 'completed_sale' : 'completed_wait')
        : status;
    const bInfo = badgeMap[compositeKey] || { text:status, cls:'' };
    badge.innerText = bInfo.text;
    badge.className = 'dt-status ' + bInfo.cls;

    // ──   ────────────────────────────────
    const priceDisplay = price === 'FREE'
        ? '<span style="color:#166534;font-weight:900;">FREE</span>'
        : price;

    let gridHTML = `
        <div class="info-box">
            <div class="info-label">Price</div>
            <div class="info-val">${priceDisplay}</div>
        </div>
        <div class="info-box">
            <div class="info-label">Sales Count</div>
            <div class="info-val">${status==='converting'||status==='failed'?'—':sales.toLocaleString()+''}</div>
        </div>`;

    if(status === 'converting'){
        gridHTML += `
        <div class="info-box">
            <div class="info-label"></div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label"> Status</div>
            <div class="info-val" style="font-size:13px;color:#92400e;"> …</div>
        </div>`;
    } else if(status === 'completed'){
        const pubColor = completedSub==='sale'?'#166534':'#1d4ed8';
        gridHTML += `
        <div class="info-box">
            <div class="info-label">Publish Date</div>
            <div class="info-val" style="font-size:15px;color:${pubColor};">${pubDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label"></div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>`;
    } else if(status === 'expired'){
        gridHTML += `
        <div class="info-box">
            <div class="info-label">Expiry Date</div>
            <div class="info-val" style="font-size:15px;color:#64748b;">${expDate||'—'}</div>
        </div>
        <div class="info-box">
            <div class="info-label"> Sales Count</div>
            <div class="info-val">${sales.toLocaleString()}</div>
        </div>`;
    } else if(status === 'failed'){
        gridHTML += `
        <div class="info-box">
            <div class="info-label"></div>
            <div class="info-val" style="font-size:15px;">${regDate||'—'}</div>
        </div>
        <div class="info-box" style="border-color:#fca5a5;background:#fff5f5;">
            <div class="info-label" style="color:#dc2626;">Failure Reason</div>
            <div class="info-val" style="font-size:13px;color:#991b1b;font-weight:700;">${failReason||'—'}</div>
        </div>`;
    }
    document.getElementById('infoGrid').innerHTML = gridHTML;

    // ──   ──────────────────────────────────
    const acts = document.getElementById('actionContainer');
    if(status === 'failed'){
        acts.innerHTML = `<button class="dt-btn dt-btn-danger" onclick="if(confirm(' ?')){alert('.');location.href='studio_myworks.html';}">🗑 </button>`;
    } else if(status === 'expired'){
        acts.innerHTML = `<button class="dt-btn dt-btn-secondary" onclick="alert(' .  .')"> </button>`;
    } else {
        acts.innerHTML = '';
    }

    // ──  ───────────────────────────────────
    // 
    const tlItem = (isActive, date, titleText, titleColor, desc) => `
        <div class="tl-item${isActive?' active':''}">
            <div class="tl-date">${date}${isActive?' <span style="color:#1d4ed8;font-size:11px;">()</span>':''}</div>
            <div class="tl-title" style="color:${titleColor||'#1e293b'};">${titleText}</div>
            <div class="tl-desc">${desc}</div>
        </div>`;

    const tReg       = tlItem(false,'2026.03.10 10:00','  ','','RO Factory    .');
    const tConvert   = tlItem(status==='converting', '2026.03.13 14:00','🔄    ','#92400e','        .');
    const tCompWait  = tlItem(status==='completed'&&completedSub==='wait', '2026.03.15 09:30','✅ Converted —  ','#1d4ed8',' . Publish Date   Market  .');
    const tCompSale  = tlItem(status==='completed'&&completedSub==='sale', pubDate?pubDate.replace(/\./g,'/')+' 00:00':'—', '🎉  ','#166634','Market   .    .');
    const tExpired   = tlItem(true, expDate||'—', '⏹  ','#64748b','Sales Period  Market  .');
    const tFailed    = tlItem(true, '2026.03.14 16:20','❗ Failed','#991b1b',`    . : ${failReason||' '}`);

    let logs = [];
    if(status === 'converting'){
        logs = [tConvert, tReg];
    } else if(status === 'completed' && completedSub === 'wait'){
        logs = [tCompWait, tConvert, tReg];
    } else if(status === 'completed' && completedSub === 'sale'){
        logs = [tCompSale, tCompWait, tConvert, tReg];
    } else if(status === 'expired'){
        logs = [tExpired, tCompSale, tCompWait, tConvert, tReg];
    } else if(status === 'failed'){
        logs = [tFailed, tConvert, tReg];
    } else {
        logs = [tReg];
    }
    document.getElementById('timelineContainer').innerHTML = logs.join('');
});

function openPreview(){
    const p = new URLSearchParams(window.location.search);
    const title = p.get('title') || '';
    document.getElementById('modalTitle').innerText = '▶ ' + title + ' — Preview ';
    const modal = document.getElementById('previewModal');
    modal.style.display = 'flex';
    //     src  
    // const vid = document.getElementById('previewVideo');
    // vid.src = 'url';
}
function closePreview(){
    document.getElementById('previewModal').style.display = 'none';
    const vid = document.getElementById('previewVideo');
    vid.pause();
    vid.currentTime = 0;
}
//     
document.getElementById('previewModal').addEventListener('click', function(e){
    if(e.target === this) closePreview();
});
</script>
</body>
</html>
