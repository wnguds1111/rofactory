<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO FACTORY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard',system-ui,-apple-system,sans-serif; @apply bg-[#f0f2f5] text-slate-900 antialiased; }
        a { text-decoration:none; color:inherit; }

        .studio-layout { @apply flex lg:flex-row flex-col lg:gap-8 gap-[12px] md:gap-[24px] max-w-[1200px] mx-auto mt-6 md:mt-8 lg:mt-[45px] px-3 md:px-6 lg:px-10 min-h-[70vh]; }

        /* Sidebar */
        .studio-sidebar { @apply w-full lg:w-[260px] shrink-0 flex flex-col md:flex-row lg:flex-col lg:gap-5 gap-2.5 md:gap-5; }
        .profile-card { @apply bg-white rounded-2xl lg:p-7 p-4 border border-slate-200 lg:flex-none flex items-center md:items-center lg:items-stretch lg:text-center text-left lg:flex-col lg:gap-0 gap-4 md:flex-1 mb-0 md:mb-0 lg:mb-5; }
        .avatar { @apply w-[52px] h-[52px] md:w-[64px] md:h-[64px] lg:w-[72px] lg:h-[72px] rounded-full bg-white mx-0 lg:mx-auto mb-0 lg:mb-3 flex items-center justify-center border-2 border-slate-200 overflow-hidden shrink-0; }
        .avatar img { @apply w-full h-full object-contain rounded-full; }
        .user-info-wrap { @apply flex-1 flex flex-col lg:block md:block items-start; }
        .user-name { @apply text-base md:text-[18px] lg:text-lg font-black mb-1 lg:mb-2 md:mb-2; }
        .user-kp { @apply text-xs lg:text-[13px] font-bold text-slate-500 bg-slate-50 py-2 px-3.5 rounded-xl block mb-1.5 md:mb-2 lg:mb-3 inline-block lg:w-full w-auto md:w-auto; }
        .user-kp span { @apply text-blue-500 font-black text-base; }
        .btn-kp { @apply block w-full lg:w-full w-auto md:w-auto lg:py-[11px] py-[9px] px-3.5 md:px-[20px] lg:px-0 rounded-xl text-xs lg:text-[13px] font-extrabold text-white bg-gradient-to-br from-blue-500 to-blue-900 text-center transition-all hover:opacity-90 hover:-translate-y-px md:inline-block lg:block; }

        /* Nav */
        .studio-nav { @apply bg-white rounded-[14px] lg:rounded-[18px] border border-slate-200 p-[10px] lg:p-3 list-none flex md:flex-wrap lg:flex-nowrap lg:flex-col overflow-x-auto w-full gap-2 md:gap-2; scrollbar-width: none; }
        .studio-nav::-webkit-scrollbar { display:none; }
        .s-nav-item { @apply flex md:flex-1 lg:flex-none items-center justify-center lg:justify-start gap-2.5 py-[10px] px-4 lg:py-[13px] lg:px-4 text-slate-500 font-bold text-[13px] lg:text-[14px] rounded-[10px] cursor-pointer transition-all hover:bg-slate-50 hover:text-slate-800 shrink-0 lg:shrink-0 whitespace-nowrap lg:mb-[4px] mb-0 min-w-0 md:min-w-[140px]; }
        .s-nav-item:last-child { @apply mb-0; }
        .s-nav-item.active { @apply bg-blue-50 text-blue-700; }
        .s-nav-icon { @apply text-[17px]; }

        /* Main Panel */
        .studio-main { @apply flex-1 pb-10 lg:pb-[60px]; }
        .panel-header { @apply flex flex-col md:flex-row justify-between items-start md:items-center mb-4 lg:mb-6 gap-2.5 md:gap-[10px] lg:gap-0 pt-1 lg:pt-2; }
        .panel-title { @apply text-[18px] lg:text-[22px] font-black; }
        .btn-register { @apply bg-slate-900 text-white border-none py-[11px] px-[22px] rounded-xl text-[12px] lg:text-[13px] font-extrabold cursor-pointer flex justify-center items-center gap-[4px] lg:gap-[6px] hover:bg-slate-800 w-full md:w-auto whitespace-nowrap; }
        .btn-market { @apply inline-flex items-center gap-1.5 bg-slate-900 text-white border-none py-[11px] px-[22px] rounded-xl text-[12px] lg:text-[13px] font-extrabold cursor-pointer hover:bg-slate-800 w-full md:w-auto whitespace-nowrap no-underline; }
        
        .search-bar { @apply mb-4; }
        .search-bar input { @apply w-full lg:max-w-[380px] max-w-full lg:py-[11px] py-[11px] px-[14px] rounded-[10px] border border-slate-200 font-[Pretendard] text-[13px] lg:text-[14px] bg-white focus:outline-none focus:border-blue-500; }
        
        /* Tabs */
        .sub-tabs { @apply flex gap-1 mb-5 bg-white rounded-[14px] border border-slate-200 p-1.5 overflow-x-auto; scrollbar-width:none; }
        .sub-tabs::-webkit-scrollbar { display:none; }
        .sub-tab { @apply flex-1 text-center py-[9px] lg:py-[10px] px-[14px] lg:px-[8px] text-[12px] lg:text-[13px] font-bold text-slate-400 rounded-[10px] cursor-pointer transition-all shrink-0 whitespace-nowrap; }
        .sub-tab.active { @apply bg-blue-700 text-white; }
        .sub-tab:hover:not(.active) { @apply text-slate-800 bg-blue-50; }

        /* Items */
        .item-list { @apply bg-white rounded-[16px] border border-slate-200 overflow-hidden; }
        .item-row { @apply flex flex-wrap md:flex-nowrap items-start md:items-center py-[14px] px-[16px] md:py-[20px] md:px-[24px] border-b border-slate-100 gap-[12px] md:gap-[18px] transition-all cursor-pointer hover:bg-slate-50; }
        .item-row:last-child { @apply border-b-0; }
        .item-thumb { @apply w-[60px] h-[60px] md:w-[76px] md:h-[76px] rounded-[10px] md:rounded-[12px] flex items-center justify-center text-[22px] md:text-[30px] shrink-0; }
        .item-info { @apply flex-1 min-w-0; }
        .item-tag { @apply text-[10px] font-extrabold bg-slate-100 text-slate-600 py-[3px] px-[8px] rounded-[6px] mb-[5px] inline-block; }
        .item-title { @apply text-[14px] md:text-[15px] font-extrabold text-[#0f172a] mb-[5px] leading-snug; }
        .item-meta { @apply text-[11px] md:text-[12px] text-slate-400 flex flex-wrap gap-[6px] md:gap-[12px]; }
        
        .item-status { @apply py-[4px] px-[10px] md:py-[5px] md:px-[13px] rounded-[12px] text-[10px] md:text-[11px] font-extrabold shrink-0; }
        .s-converting     { @apply bg-amber-100 text-amber-800; }
        .s-completed-wait { @apply bg-blue-100 text-blue-700; }
        .s-completed-sale { @apply bg-green-100 text-green-800; }
        .s-expired        { @apply bg-slate-100 text-slate-500; }
        .s-failed         { @apply bg-red-100 text-red-800; }
        
        .item-actions { @apply flex gap-2 w-full md:w-auto mt-0 shrink-0; }
        .btn-action { @apply flex-1 md:flex-none text-center bg-white border border-slate-200 text-slate-600 py-[8px] px-[10px] md:py-[7px] md:px-[14px] rounded-[8px] text-[12px] font-bold cursor-pointer transition-all hover:bg-slate-50 hover:border-slate-300; }
        
        .empty-state { @apply p-[60px] text-center text-slate-400; }
        .empty-icon { @apply text-[44px] mb-[14px] opacity-40; }
        .empty-text { @apply text-[15px] font-bold; }

        .footer { @apply mt-12; }
        .footer img { @apply w-full h-auto block; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-init.js"></script>
</head>
<body>
    <script src="gnb.js"></script>

<div class="studio-layout">
    <!-- 사이드바 -->
    <aside class="studio-sidebar">
        <div class="profile-card">
            <div class="avatar"><img src="images/poring_hero.png" alt="포링" onerror="this.outerHTML='<span style=\'font-size:32px;\'>🧙</span>'"></div>
            <div class="user-info-wrap">
                <div class="user-name">GravityUser</div>
                <span class="user-kp">보유 <span>0</span> KP</span>
                <a href="#" class="btn-kp">💳 KP 충전하기</a>
            </div>
        </div>
        <ul class="studio-nav">
            <li onclick="location.href='studio_myworks.html'" class="s-nav-item active"><span class="s-nav-icon">🪄</span> 나의 작품 관리</li>
            <li onclick="location.href='studio_inventory.html'" class="s-nav-item"><span class="s-nav-icon">🎒</span> 구매 작품 관리</li>
            <li onclick="location.href='studio_wishlist.html'" class="s-nav-item"><span class="s-nav-icon" style="color:#ef4444;">💖</span> 찜한 상품 보기</li>
        </ul>
    </aside>

    <!-- 메인 -->
    <main class="studio-main">
        <div class="panel-header">
            <h2 class="panel-title">나의 작품 관리</h2>
            <a href="register.html" class="btn-register">✨ 새 작품 등록하기</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" oninput="applyFilter()" placeholder="🔍  작품명 검색...">
        </div>
        <div class="sub-tabs">
            <div class="sub-tab active" id="tab-all"       onclick="setTab('all')">전체</div>
            <div class="sub-tab"       id="tab-converting" onclick="setTab('converting')">변환 중</div>
            <div class="sub-tab"       id="tab-completed"  onclick="setTab('completed')">변환 완료</div>
            <div class="sub-tab"       id="tab-failed"     onclick="setTab('failed')">변환 실패</div>
            <div class="sub-tab"       id="tab-expired"    onclick="setTab('expired')">작품 만료</div>
        </div>
        <div class="item-list" id="workList"></div>
    </main>
</div>

<footer class="footer">
    <img src="images/FOOTER.png" alt="Footer">
</footer>

<script>
const works = [
    { id:7,  title:"천사의 날개 깃털 발자국", tag:"발자국", status:"converting",  bg:"linear-gradient(120deg,#e0c3fc,#8ec5fc)",   icon:"🪽", price:"9,900 KP",  sales:0,    regDate:"19.03.2026" },
    { id:15, title:"황금빛 재화 발자국",       tag:"발자국", status:"converting",  bg:"linear-gradient(to right,#f6d365,#fda085)", icon:"💰", price:"15,000 KP", sales:0,    regDate:"15.03.2026" },

    { id:3,  title:"토끼 귀 발자국",           tag:"발자국", status:"completed",   completedSub:"wait", bg:"linear-gradient(to right,#74ebd5,#9face6)", icon:"🐰", price:"1,200 KP", sales:0,    pubDate:"01.04.2026" },
    { id:8,  title:"고양이 꾹꾹이 발자국",     tag:"발자국", status:"completed",   completedSub:"wait", bg:"linear-gradient(to right,#fa709a,#fee140)", icon:"🐾", price:"4,500 KP", sales:0,    pubDate:"05.04.2026" },
    { id:18, title:"크리스탈 조각 발자국",     tag:"발자국", status:"completed",   completedSub:"sale", bg:"linear-gradient(to right,#e0c3fc,#8ec5fc)", icon:"💎", price:"6,000 KP", sales:142,  pubDate:"20.03.2026" },
    { id:1,  title:"포링의 벚꽃 발자국",       tag:"발자국", status:"completed",   completedSub:"sale", bg:"linear-gradient(135deg,#ff9a9e,#fecfef)",   icon:"🌸", price:"FREE",     sales:1420, pubDate:"11.03.2026" },
    { id:5,  title:"초보자의 첫 발자국",       tag:"발자국", status:"completed",   completedSub:"sale", bg:"linear-gradient(135deg,#a18cd1,#fbc2eb)",   icon:"👣", price:"FREE",     sales:5302, pubDate:"10.01.2026" },

    { id:4,  title:"겨울눈 장식 발자국",       tag:"발자국", status:"expired",     bg:"linear-gradient(to right,#ccc,#aaa)",         icon:"❄️", price:"800 KP",   sales:830,  expDate:"28.02.2026" },
    { id:9,  title:"별빛 발자국",              tag:"발자국", status:"expired",     bg:"linear-gradient(135deg,#667eea,#764ba2)",     icon:"⭐", price:"1,000 KP", sales:2150, expDate:"31.12.2025" },
    { id:19, title:"낙엽 바스락 발자국",       tag:"발자국", status:"expired",     bg:"linear-gradient(to right,#d4fc79,#96e6a1)",  icon:"🍂", price:"1,500 KP", sales:1200, expDate:"30.11.2025" },

    { id:10, title:"불타는 용암 발자국",       tag:"발자국", status:"failed",      bg:"linear-gradient(to right,#fca5a5,#fef08a)", icon:"🔥", price:"2,000 KP", sales:0, regDate:"25.03.2026", failReason:"변환 실패" },
    { id:12, title:"깨진 유리 조각 발자국",    tag:"발자국", status:"failed",      bg:"linear-gradient(to right,#9ca3af,#d1d5db)", icon:"🧪", price:"500 KP",   sales:0, regDate:"26.03.2026", failReason:"변환 실패" },
    { id:13, title:"독의 늪지대 발자국",       tag:"발자국", status:"failed",      bg:"linear-gradient(to right,#86efac,#4ade80)", icon:"☠️", price:"3,000 KP", sales:0, regDate:"27.03.2026", failReason:"변환 실패" }
];

let currentTab = 'all';
function setTab(tab){
    currentTab = tab;
    document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    applyFilter();
}
function applyFilter(){
    const kw = document.getElementById('searchInput').value.trim().toUpperCase();
    const container = document.getElementById('workList');
    let rows = [];
    works.forEach(w => {
        if(currentTab !== 'all' && w.status !== currentTab) return;
        if(kw && !w.title.toUpperCase().includes(kw)) return;
        rows.push(buildRow(w));
    });
    container.innerHTML = rows.length
        ? rows.join('')
        : `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">해당 조건의 작품이 없습니다.</div></div>`;
}
function buildRow(w){
    const isExpired = w.status === 'expired';
    const gs      = isExpired ? 'filter:grayscale(1);' : '';
    const strike  = isExpired ? 'text-decoration:line-through;' : '';
    const opacity = isExpired ? '0.7' : '1';

    const detailLink = `studio_detail?status=${w.status}&completedSub=${w.completedSub||''}&title=${encodeURIComponent(w.title)}&icon=${encodeURIComponent(w.icon)}&bg=${encodeURIComponent(w.bg)}&price=${encodeURIComponent(w.price)}&sales=${w.sales||0}&regDate=${encodeURIComponent(w.regDate||'')}&pubDate=${encodeURIComponent(w.pubDate||'')}&expDate=${encodeURIComponent(w.expDate||'')}&failReason=${encodeURIComponent(w.failReason||'')}`;

    let badge = '';
    if(w.status === 'converting'){
        badge = `<span class="item-status s-converting">변환 중</span>`;
    } else if(w.status === 'completed'){
        badge = w.completedSub === 'wait'
            ? `<span class="item-status s-completed-wait">판매 대기</span>`
            : `<span class="item-status s-completed-sale">판매 중</span>`;
    } else if(w.status === 'expired'){
        badge = `<span class="item-status s-expired">작품 만료</span>`;
    } else if(w.status === 'failed'){
        badge = `<span class="item-status s-failed">변환 실패</span>`;
    }

    let meta = `<span>가격: ${w.price}</span>`;
    if(w.status === 'converting'){
        meta += `<span>등록일: ${w.regDate}</span><span>판매수: 0</span>`;
    } else if(w.status === 'completed'){
        const c = w.completedSub === 'sale' ? '#166534' : '#1d4ed8';
        const dateLabel = '판매 시작일';
        meta += `<span style="color:${c};font-weight:800;">${dateLabel}: ${w.pubDate}</span>`;
        if(w.completedSub === 'sale') meta += `<span>판매수: <b style="color:#0f172a;">${w.sales.toLocaleString()}</b></span>`;
    } else if(w.status === 'expired'){
        meta += `<span style="color:#64748b;">만료일: ${w.expDate}</span>`;
        meta += `<span>판매수: <b style="color:#0f172a;">${w.sales.toLocaleString()}</b></span>`;
    } else if(w.status === 'failed'){
        meta += `<span>등록일: ${w.regDate}</span>`;
        meta += `<span style="color:#dc2626;">사유: 변환 실패</span>`;
    }

    return `
    <div class="item-row" onclick="location.href='${detailLink}'" style="opacity:${opacity};">
        <div class="item-thumb" style="background:${w.bg};${gs}">${w.icon}</div>
        <div class="item-info">
            <span class="item-tag">${w.tag}</span>
            <div class="item-title" style="${strike}">${w.title}</div>
            <div class="item-meta">${meta}</div>
        </div>
        ${badge}
        <div class="item-actions">
            <button class="btn-action" onclick="event.stopPropagation();location.href='${detailLink}'">상세 보기</button>
        </div>
    </div>`;
}

applyFilter();
</script>
</body>
</html>
