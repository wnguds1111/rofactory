<!DOCTYPE html>

<head>

    <title>RO FACTORY 프로토 타입 V1.0</title>
    <!-- Use Pretendard for clean, premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #e0f2fe; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; position: relative; overflow: hidden; }
        
        /* Subtle dynamic background blobs */
        .blob-1 { position: absolute; top: -100px; left: -100px; width: 400px; height: 400px; background: #bae6fd; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: 0; animation: float 10s ease-in-out infinite alternate; }
        .blob-2 { position: absolute; bottom: -50px; right: -50px; width: 350px; height: 350px; background: #c7d2fe; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: 0; animation: float 12s ease-in-out infinite alternate-reverse; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(30px) scale(1.05); } }

        .portal-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); padding: 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 580px; z-index: 10; border: 1px solid rgba(255,255,255,0.5); }
        .badge { display: inline-block; padding: 6px 14px; background: #1e293b; color: #fff; font-size: 13px; font-weight: 800; border-radius: 20px; margin-bottom: 20px; letter-spacing: 0.5px;}
        .title { font-size: 38px; font-weight: 900; color: #0f172a; margin-bottom: 15px; letter-spacing: -1px; }
        .title span { color: #0ea5e9; }
        .subtitle { font-size: 16px; font-weight: 700; color: #64748b; margin-bottom: 45px; }
        
        .link-row { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .portal-link { display: flex; align-items: center; justify-content: space-between; padding: 22px 25px; background: #f8fafc; border-radius: 14px; text-decoration: none; color: #1e293b; font-weight: 800; font-size: 18px; transition: all 0.3s ease; border: 1px solid transparent; }
        .portal-link:hover { background: #fff; border-color: #7dd3fc; color: #0284c7; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(2, 132, 199, 0.1); }
        .portal-link span:last-child { font-size: 24px; color: #94a3b8; font-weight: 400; transition: 0.3s; }
        .portal-link:hover span:last-child { color: #0284c7; transform: translateX(5px); }
        
        .icon { display:inline-flex; align-items:center; justify-content:center; width: 40px; height: 40px; border-radius: 10px; margin-right: 15px; font-size: 20px; }
        .icon-front { background: #e0e7ff; color: #4f46e5; }
        .icon-admin { background: #dcfce7; color: #16a34a; }
        .icon-doc { background: #f1f5f9; color: #64748b; }

        .footer { margin-top: 40px; font-size: 14px; font-weight: 700; color: #94a3b8; z-index: 10; }
    </style>
</head>
<body>
    <div class="blob-1"></div>

        <div class="link-row">

                <div style="display:flex; align-items:center;">

                </div>
                <span>→</span>
            </a>
            <a href="admin.html" target="_blank" class="portal-link">

                </div>

            <a href="policy.html" target="_self" class="portal-link">

                </div>
                <span>→</span>
            </a>
            <a href="ia.html" target="_self" class="portal-link">
                <div style="display:flex; align-items:center;">

                </div>
                <span>→</span>
            </a>
            <a href="flowchart.html" target="_self" class="portal-link">
