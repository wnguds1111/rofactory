<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO Factory | 찜한 상품</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard',system-ui,-apple-system,sans-serif; background:#f0f2f5; color:#0f172a; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }


        /* GNB 스타일은 styles.css에서 관리 */


        /* 레이아웃 */
        .studio-layout { display:flex; gap:32px; margin:40px auto 0; max-width:1400px; padding:0 40px; min-height:70vh; }
        .studio-sidebar { width:260px; flex-shrink:0; }
        .profile-card { background:#fff; border-radius:18px; padding:28px 22px; text-align:center; margin-bottom:20px; border:1px solid #e2e8f0; }
        .avatar { width:72px; height:72px; border-radius:50%; background:#fff; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; border:2px solid #e8eaed; overflow:hidden; }
        .avatar img { width:100%; height:100%; object-fit:contain; border-radius:50%; }
        .user-name { font-size:18px; font-weight:900; margin-bottom:8px; }
        .user-kp { font-size:13px; font-weight:700; color:#64748b; background:#f8fafc; padding:8px 14px; border-radius:10px; display:block; margin-bottom:12px; }
        .user-kp span { color:#3b82f6; font-weight:900; font-size:16px; }
        .btn-kp { display:block; width:100%; padding:11px; border-radius:12px; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(135deg,#3b82f6,#1e3a8a); text-align:center; transition:0.2s; }
        .btn-kp:hover { opacity:0.9; transform:translateY(-1px); }
        .studio-nav { background:#fff; border-radius:18px; border:1px solid #e2e8f0; padding:12px; list-style:none; }
        .s-nav-item { display:flex; align-items:center; gap:10px; padding:13px 16px; color:#64748b; font-weight:700; font-size:14px; border-radius:10px; cursor:pointer; transition:0.2s; margin-bottom:4px; }
        .s-nav-item:last-child { margin-bottom:0; }
        .s-nav-item:hover { background:#f8fafc; color:#1e293b; }
        .s-nav-item.active { background:#eff6ff; color:#1d4ed8; }
        .s-nav-icon { font-size:17px; }
        .studio-main { flex:1; padding-bottom:60px; }
        .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .panel-title { font-size:22px; font-weight:900; }

        /* 리스트 */
        .item-list { background:#fff; border-radius:16px; border:1px solid #e2e8f0; overflow:hidden; }
        .item-row { display:flex; align-items:center; padding:20px 24px; border-bottom:1px solid #f1f5f9; gap:18px; transition:0.2s; }
        .item-row:hover { background:#f8fafc; }
        .item-row:last-child { border-bottom:none; }
        .item-thumb { width:76px; height:76px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; }
        .item-info { flex:1; min-width:0; }
        .item-tag { font-size:10px; font-weight:800; background:#fee2e2; color:#ef4444; border:1px solid #fecaca; padding:3px 8px; border-radius:6px; margin-bottom:5px; display:inline-block; }
        .item-title { font-size:15px; font-weight:800; color:#0f172a; margin-bottom:5px; }
        .item-meta { font-size:12px; color:#94a3b8; display:flex; gap:12px; flex-wrap:wrap; }
        .item-actions { display:flex; gap:8px; flex-shrink:0; }
        .btn-action { background:#fff; border:1px solid #e2e8f0; color:#475569; padding:7px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; transition:0.2s; }
        .btn-action:hover { background:#f8fafc; }
        .btn-action.primary { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
        .btn-action.primary:hover { background:#1e40af; }
        .search-bar { margin-bottom:16px; }
        .search-bar input { width:100%; max-width:380px; padding:11px 14px; border-radius:10px; border:1px solid #e2e8f0; font-family:'Pretendard'; font-size:14px; background:#fff; }
        .search-bar input:focus { outline:none; border-color:#3b82f6; }
        .wish-count { font-size:13px; color:#94a3b8; font-weight:600; margin-bottom:16px; }
        .wish-count b { color:#1e293b; }
        .empty-state { padding:60px; text-align:center; color:#94a3b8; }
        .empty-icon { font-size:44px; margin-bottom:14px; opacity:0.4; }
        .empty-text { font-size:15px; font-weight:700; }
        .btn-market { display:inline-flex; align-items:center; gap:6px; background:#0f172a; color:#fff; border:none; padding:11px 22px; border-radius:11px; font-size:13px; font-weight:800; }
        .btn-market:hover { background:#1e293b; }
        .footer { margin-top:48px; }
        .footer img { width:100%; height:auto; display:block; }

        @media(max-width:1024px) {
            .studio-layout { flex-direction:column; padding:0 24px; gap:24px; }
            .studio-sidebar { width:100%; display:flex; gap:20px; }
            .profile-card { flex:1; margin-bottom:0; display:flex; align-items:center; text-align:left; gap:20px; padding:20px; }
            .avatar { margin:0; width:64px; height:64px; flex-shrink:0; }
            .user-info-wrap { flex:1; }
            .user-kp { display:inline-block; margin-bottom:8px; }
            .btn-kp { width:auto; padding:8px 20px; display:inline-block; }
            .studio-nav { flex:2; display:flex; flex-wrap:wrap; gap:8px; padding:12px; align-content:center; }
            .s-nav-item { flex:1; justify-content:center; margin-bottom:0; min-width:140px; }
        }
        @media(max-width:768px) {
            .studio-layout { padding:0 16px; margin-top:24px; }
            .studio-sidebar { flex-direction:column; gap:12px; }
            .profile-card { flex-direction:column; text-align:center; }
            .user-info-wrap { width:100%; display:flex; flex-direction:column; align-items:center; }
            .btn-kp { width:100%; }
            .studio-nav { flex-direction:column; }
            .s-nav-item { justify-content:flex-start; min-width:100%; }
            .panel-header { flex-direction:column; align-items:flex-start; gap:16px; }
            .item-row { flex-direction:column; align-items:flex-start; padding:16px; }
            .item-thumb { width:100%; height:140px; font-size:40px; }
            .item-actions { width:100%; margin-top:10px; display:flex; gap:8px; }
            .btn-action { flex:1; text-align:center; justify-content:center; }
        }
    </style>
</head>
<body>
    <!-- Global GNJOY Bar -->
    <div class="gnjoy-topbar">
        <div class="container">
            <div class="gnjoy-logo">
                <img src="images/gnjoy_logo.png" alt="GNJOY" style="height: 18px;">
            </div>
            <div class="gnjoy-links">
                <div class="lang-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    EN
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <a href="#" class="btn-signup">Sign Up</a>
                <a href="#" class="btn-login">Login</a>
            </div>
        </div>
    </div>
    <!-- GNB -->
    <header class="gnb">
        <div class="container gnb-center-layout">
            <nav class="nav-left">
                <a href="#" class="gnb-item"><img src="images/icon_seasonpass.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">🎟️</span><span class="gnb-text">SUBSCRIPTION</span></a>
                <span class="gnb-dot"></span>
                <a href="#" class="gnb-item"><img src="images/icon_topup.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">💎</span><span class="gnb-text">TOP UP</span></a>
                <span class="gnb-dot"></span>
                <div class="dropdown-wrapper">
                    <a href="market.html" class="gnb-item"><img src="images/icon_rofactory.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">🏭</span><span class="gnb-text">RO FACTORY</span></a>
                    <div class="dropdown-menu">
                        <a href="register.html">작품 등록</a>
                        <a href="market.html">마켓 이동</a>
                        <a href="#" onclick="alert('게시글 연동 예정입니다.'); return false;">가이드 안내</a>
                        <a href="studio_myworks.html">마이 스튜디오</a>
                    </div>
                </div>
                <span class="gnb-dot"></span>
                <a href="#" class="gnb-item"><img src="images/icon_getporing.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">🐾</span><span class="gnb-text">GET PORING</span></a>
            </nav>
            <div class="logo logo-center"><a href="main2.html"><img src="images/roz_logo.png" alt="ROZ Logo" class="roz-logo-img" onerror="this.outerHTML='<span class=\'logo-text\'>RAGNAROK ZERO</span>'"></a></div>
            <nav class="nav-right">
                <a href="#" class="gnb-item"><img src="images/icon_news.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">📜</span><span class="gnb-text">NEWS</span></a>
                <span class="gnb-dot"></span>
                <a href="#" class="gnb-item"><img src="images/icon_gameinfo.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">💡</span><span class="gnb-text">GAME INFO</span></a>
                <span class="gnb-dot"></span>
                <a href="#" class="gnb-item"><img src="images/icon_resource.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">🗃️</span><span class="gnb-text">RESOURCE</span></a>
                <span class="gnb-dot"></span>
                <a href="#" class="gnb-item"><img src="images/icon_community.png" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="gnb-emoji" style="display:none; font-size:24px;">💬</span><span class="gnb-text">COMMUNITY</span></a>
            </nav>
        </div>
    </header>

    <div class="studio-layout">
        <aside class="studio-sidebar">
            <div class="profile-card">
                <div class="avatar"><img src="images/poring_hero.png" alt="포링" onerror="this.outerHTML='<span style=\'font-size:32px;\'>🧙</span>'"></div>
                <div class="user-info-wrap">
                    <div class="user-name">GravityUser</div>
                    <span class="user-kp">보유 <span>0</span> KP</span>
                    <a href="#" class="btn-kp">💳 KP 충전하기</a>
                </div>
            </div>
            <ul class="studio-nav">
                <li onclick="location.href='studio_myworks.html'" class="s-nav-item"><span class="s-nav-icon">🪄</span> 나의 작품 관리</li>
                <li onclick="location.href='studio_inventory.html'" class="s-nav-item"><span class="s-nav-icon">🎒</span> 구매 작품 관리</li>
                <li onclick="location.href='studio_wishlist.html'" class="s-nav-item active"><span class="s-nav-icon" style="color:#ef4444;">💖</span> 찜한 상품 보기</li>
            </ul>
        </aside>

        <main class="studio-main">
            <div class="panel-header">
                <h2 class="panel-title">찜한 상품 보기</h2>
                <a href="market.html" class="btn-market">마켓 둘러보기 🛍️</a>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍  작품명 검색...">
            </div>
            <div class="wish-count">전체 <b id="wishCount">0</b>개</div>
            <div class="item-list" id="wishList"></div>
        </main>
    </div>

    <footer class="footer"><img src="images/FOOTER.png" alt="Footer"></footer>

<script>
let wishlist = [
    { id:5,  title:"황금빛 엘프의 궤적", tag:"발자국", status:"onsale",  bg:"linear-gradient(to right,#f83600,#f9d423)", icon:"✨", price:"9,000 KP" },
    { id:9,  title:"아쿠아 마린 슬라이드", tag:"발자국", status:"onsale", bg:"linear-gradient(to right,#4facfe,#00f2fe)",  icon:"🌊", price:"4,200 KP" },
    { id:8,  title:"퓨어 스노우 발걸음",   tag:"발자국", status:"expired", bg:"linear-gradient(to top,#e6e9f0,#eef1f5)",  icon:"⛄", price:"FREE" },
];
function renderList(){
    const kw = document.getElementById('searchInput').value.trim().toUpperCase();
    const container = document.getElementById('wishList');
    const filtered = wishlist.filter(w=>w.title.toUpperCase().includes(kw));
    document.getElementById('wishCount').textContent = filtered.length;
    if(!filtered.length){
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">💖</div><div class="empty-text">찜한 상품이 없습니다.</div></div>`;
        return;
    }
    container.innerHTML = filtered.map((w,i)=>{
        const isExp = w.status==='expired';
        const gs = isExp?'filter:grayscale(1);':'';
        const op = isExp?'0.7':'1';
        const strike = isExp?'text-decoration:line-through;':'';
        const priceColor = w.price==='FREE'?'#166534':'#1d4ed8';
        const detailLink = `market.html?detail=${w.id}`;
        return `
        <div class="item-row" style="opacity:${op};cursor:${isExp?'default':'pointer'};" ${!isExp?`onclick="location.href='${detailLink}'"`:''}>
            <div class="item-thumb" style="background:${w.bg};${gs}">${w.icon}</div>
            <div class="item-info">
                <span class="item-tag">💖 찜 목록</span>
                <div class="item-title" style="${strike}">${w.title}</div>
                <div class="item-meta">
                    <span style="color:${priceColor};font-weight:800;font-size:13px;">${w.price}</span>
                    ${isExp?'<span style="color:#dc2626;">판매 종료됨</span>':''}
                </div>
            </div>
            <div class="item-actions">
                <button class="btn-action" style="color:#ef4444;border-color:#fca5a5;" onclick="event.stopPropagation();removeFav(${w.id})">💖 찜 해제</button>
                ${!isExp
                    ? `<button class="btn-action primary" onclick="event.stopPropagation();location.href='${detailLink}'">상세 보기</button>`
                    : `<button class="btn-action" disabled style="opacity:0.4;">판매 종료</button>`}
            </div>
        </div>`;
    }).join('');
}
function removeFav(id){
    if(!confirm('해당 상품의 찜을 해제하시겠습니까?')) return;
    wishlist = wishlist.filter(w=>w.id!==id);
    renderList();
}
document.addEventListener('DOMContentLoaded', renderList);
</script>
</body>
</html>
