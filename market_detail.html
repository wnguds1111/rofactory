        .range-fill { position: absolute; top: 13px; height: 6px; background: #025DD0; border-radius: 3px; z-index: 1; }
        input[type="range"].dual-range { position: absolute; top: 13px; left: 0; width: 100%; height: 6px; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; margin: 0; outline: none; z-index: 2; }

    <script>
        function goToStep(step) {
            document.querySelectorAll('.market-panel').forEach(el => el.classList.remove('active'));
            document.getElementById('panel-' + step).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Global state mapping for Detail and Checkout
        let currentProductId = null;
        let currentKafraPoints = 0; // Set default Kafra Points to 0

        function goToDetail(id) {
            const p = mockProducts.find(x => x.id === id);
            if(!p) return;
            currentProductId = id;
            
            // Populate Detail View
            document.getElementById('detail-bread-title').innerHTML = p.title;
            document.getElementById('detail-title').innerHTML = p.title;
            // background ?�거: main_thumb_bg.jpg 고정 (HTML???��? ?�정??
            document.getElementById('detail-icon').innerText = p.icon;
            
            const tagEl = document.getElementById('detail-tag');
            if(p.tag) {
                tagEl.style.display = 'inline-block';
                tagEl.innerHTML = p.tag;
                // 메인�??�일???��? ?�상 ?�스??
                const tagColors = { 'BEST': '#ED322B', 'NEW': '#025DD0', 'HOT': '#f97316' };
                tagEl.style.background = tagColors[p.tag] || '#025DD0';
            }
            else { tagEl.style.display = 'none'; }
            
            const typeMap = { 'cute': '<span data-en="??Cute" data-ko="??귀?�운">??Cute</span>', 'fancy': '<span data-en="?�� Fancy" data-ko="?�� ?�려??>?�� Fancy</span>', 'dark': '<span data-en="?�� Dark" data-ko="?�� ?�크">?�� Dark</span>' };
            const colorMap = { 'red': '<span data-en="?�� Red" data-ko="?�� 빨강">?�� Red</span>', 'blue': '<span data-en="?�� Blue" data-ko="?�� ?�랑">?�� Blue</span>', 'green': '<span data-en="?�� Green" data-ko="?�� 초록">?�� Green</span>', 'yellow': '<span data-en="?�� Yellow" data-ko="?�� ?�랑">?�� Yellow</span>', 'black': '<span data-en="??Black" data-ko="??검??>??Black</span>', 'white': '<span data-en="??White" data-ko="???�색">??White</span>' };
            document.getElementById('detail-type-tag').innerHTML = typeMap[p.type] || '';
            document.getElementById('detail-color-tag').innerHTML = colorMap[p.color] || '';

            // 마켓 게재 만료?? pubDate + 90??계산
            const expEl = document.getElementById('detail-expiry');
            if (expEl && p.pubDate) {
                const parts = p.pubDate.split('.');
                const pub = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                pub.setDate(pub.getDate() + 90);
                const expStr = `${String(pub.getDate()).padStart(2,'0')}.${String(pub.getMonth()+1).padStart(2,'0')}.${pub.getFullYear()}`;
                expEl.textContent = expStr + ' (게시 ??90??';
            }
            
            updateDetailHeartUI(p);
            
            document.getElementById('detail-price').innerHTML = p.isFree ? '<span style="color:#22c55e;">FREE</span>' : `${p.price.toLocaleString()} <span>KP</span>`;
            
            goToStep('detail');
        }

        function updateDetailHeartUI(p) {
            const btn = document.getElementById('detail-heart');
            const icon = p.isHearted ? '?? : '??;
            btn.innerHTML = `<span style="color:#025DD0; font-size:18px;">${icon}</span> <span id="detail-heart-count" style="color:#0f172a;">${p.hearts.toLocaleString()}</span>`;
            btn.classList.toggle('hearted', !!p.isHearted);
        }

        function toggleHeart() {
            const p = mockProducts.find(x => x.id === currentProductId);
            if (!p) return;
            p.isHearted = !p.isHearted;
            p.hearts += p.isHearted ? 1 : -1;
            updateDetailHeartUI(p);
            renderProducts();
        }

        function toggleHeartFromList(id) {
            const p = mockProducts.find(x => x.id === id);
            if (!p) return;
            p.isHearted = !p.isHearted;
            p.hearts += p.isHearted ? 1 : -1;
            // ?�재 ?�세 ?�이지가 같�? ?�품?�면 ?�기??
            if (currentProductId === id) updateDetailHeartUI(p);
            renderProducts();
        }

        function openPaymentModal() {
            const p = mockProducts.find(x => x.id === currentProductId);
            if (!p) return;
            
            // Populate the payment modal UI
            document.getElementById('modal-current-balance').innerText = `${currentKafraPoints.toLocaleString()} KP`;
            document.getElementById('modal-item-name').innerHTML = p.title;
            
            if (p.isFree) {
                document.getElementById('modal-item-price').innerText = `FREE`;
                document.getElementById('modal-payment-amount').innerHTML = `0 KP (<span data-en="Free" data-ko="무료">Free</span>)`;
                document.getElementById('modal-payment-amount').style.color = '#3b82f6';
            } else {
                document.getElementById('modal-item-price').innerText = `${p.price.toLocaleString()} KP`;
                document.getElementById('modal-payment-amount').innerText = `- ${p.price.toLocaleString()} KP`;
                document.getElementById('modal-payment-amount').style.color = '#ef4444';
            }
            
            const btn = document.getElementById('btn-modal-confirm');
            const alertBox = document.getElementById('modal-warning');
            
            // Reset state
            btn.style.background = '#3b82f6';
            btn.style.cursor = 'pointer';
            btn.innerHTML = p.isFree ? '<span data-en="Free" data-ko="무료">Free</span> <span data-en="Proceed to Checkout" data-ko="결제 진행">Proceed to Checkout</span>' : `${p.price.toLocaleString()} KP <span data-en="Pay" data-ko="결제?�기">Pay</span>`;
            if(alertBox) alertBox.style.display = 'none';
            btn.onclick = executePayment;
            
            if (!p.isFree && currentKafraPoints < p.price) {
                // Not enough funds UI
                btn.style.background = '#cbd5e1';
                btn.style.cursor = 'not-allowed';
                btn.innerHTML = '<span data-en="Insufficient Points" data-ko="Kafra Point 부�?>Insufficient Points</span>';
                btn.onclick = null;
                if(alertBox) alertBox.style.display = 'block';
            }
            
            document.getElementById('paymentModal').classList.add('active');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }

        function executePayment() {
            const p = mockProducts.find(x => x.id === currentProductId);
            if (!p) return;
            
            // Update Completion Page UI variables
            document.getElementById('c-item-name').innerHTML = p.title;
            document.getElementById('c-item-price').innerText = `${p.price.toLocaleString()} KP`;
            
            currentKafraPoints -= p.price;
            document.getElementById('c-item-balance').innerText = `${currentKafraPoints.toLocaleString()} KP`;
            
            closePaymentModal();
            goToStep('complete');
        }

            { id: 12, title: '<span data-en="Dazzling Angel Feather" data-ko="?��???천사??깃털">Dazzling Angel Feather</span>', type: 'fancy', color: 'white',  price: 20000, isFree: false, tag: 'NEW',  hearts: 300,  img: 'linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%)', icon: '?���?, pubDate: '01.03.2026' }
        ];


        // MOCK MULTIPLICATION: Create 60 items so we have 5 pages
        let originalMock = [...mockProducts];
        mockProducts = [];
        for(let i=1; i<=5; i++) {
            originalMock.forEach(p => {
                mockProducts.push({
                    ...p, 
                    id: p.id + (i-1)*100, 
                    hearts: p.hearts + (i*5),
                    title: p.title
                });
            });
        }

        let activeFilters = {
            type: null, 
            color: null, 
            btnPrice: null,
            minPrice: 0,
            maxPrice: 20000,
            sort: null,
            search: ''
        };
        
        const ITEMS_PER_PAGE = 12;
        let currentPage = 1;

        function resetFilters() {
            activeFilters = { type: null, color: null, btnPrice: null, minPrice: 0, maxPrice: 20000, sort: null, search: '' };
            
            // Only clear active state for standard filter groups (not the top category group)
            document.querySelectorAll('.filter-group:not(.filter-category) .f-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.market-search-input').value = '';
            
            // visually reset sliders
            document.getElementById('minRange').value = 0;
            document.getElementById('maxRange').value = 20000;
            updateSlider(); // Will internally call renderProducts()
        }

        // Setup filter button clicking
        document.querySelectorAll('.filter-btns').forEach(group => {
            group.addEventListener('click', (e) => {
                const btn = e.target.closest('.f-btn');
                if(!btn) return;
                
                // Toggle active class visually inside this group
                if(btn.classList.contains('active')) {
                    btn.classList.remove('active');
                } else {
                    group.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
                
                // Read states
                activeFilters.type = document.querySelector('.filter-type .f-btn.active')?.dataset.val || null;
                activeFilters.color = document.querySelector('.filter-color .f-btn.active')?.dataset.val || null;
                activeFilters.btnPrice = document.querySelector('.filter-price .f-btn.active')?.dataset.val || null;
                activeFilters.sort = document.querySelector('.filter-sort .f-btn.active')?.dataset.val || null;
                
                renderProducts();
            });
        });

        // Search Handlers
        const searchInput = document.querySelector('.market-search-input');
        searchInput.addEventListener('input', (e) => {
            activeFilters.search = e.target.value.toLowerCase();
            renderProducts();
        });
        document.querySelector('.market-search-btn[style]').addEventListener('click', () => {
            searchInput.value = '';
            activeFilters.search = '';
            renderProducts();
        });

        // Dual Range Slider logic
        const minRange = document.getElementById('minRange');
        const maxRange = document.getElementById('maxRange');
        const rangeFill = document.getElementById('rangeFill');
        const priceMinLbl = document.getElementById('priceMinLabel');
        const priceMaxLbl = document.getElementById('priceMaxLabel');

        function updateSlider() {
            let minVal = parseInt(minRange.value);
            let maxVal = parseInt(maxRange.value);
            
            if (minVal > maxVal) {
                let tmp = minVal;
                minVal = maxVal;
                maxVal = tmp;
            }
            
            let maxTotal = parseInt(maxRange.max);
            let leftPerc = (minVal / maxTotal) * 100;
            let rightPerc = (maxVal / maxTotal) * 100;
            
            rangeFill.style.left = leftPerc + '%';
            rangeFill.style.width = (rightPerc - leftPerc) + '%';
            
            priceMinLbl.innerText = minVal.toLocaleString() + ' KP';
            priceMaxLbl.innerText = maxVal === maxTotal ? maxVal.toLocaleString() + '+ KP' : maxVal.toLocaleString() + ' KP';
            
            activeFilters.minPrice = minVal;
            activeFilters.maxPrice = maxVal;
            renderProducts();
        }
        
        minRange.addEventListener('input', updateSlider);
        maxRange.addEventListener('input', updateSlider);

        function renderProducts() {
            const grid = document.getElementById('marketGridContainer');
            grid.innerHTML = '';
            
            let filtered = mockProducts.filter(p => {
                if(activeFilters.type && p.type !== activeFilters.type) return false;
                if(activeFilters.color && p.color !== activeFilters.color) return false;
                
                // Button Price Filter Logic 
                if(activeFilters.btnPrice) {
                    const priceVal = parseInt(activeFilters.btnPrice);
                    if(priceVal === 0 && !p.isFree) return false;
                    if(priceVal === 1000 && p.price > 1000) return false;
                    if(priceVal === 5000 && (p.price <= 1000 || p.price > 5000)) return false;
                    if(priceVal === 10000 && (p.price <= 5000 || p.price > 10000)) return false;
                    if(priceVal === 20000 && p.price < 10000) return false;
                }

                // Range Slider Filter Logic
                if(p.price < activeFilters.minPrice) return false;
                if(activeFilters.maxPrice < 20000 && p.price > activeFilters.maxPrice) return false;

                // Tag Filter Logic (Hard Filter instead of sorting)
                if(activeFilters.sort) {
                    if(activeFilters.sort === 'new' && p.tag !== 'NEW') return false;
                    if(activeFilters.sort === 'trending' && p.tag !== 'HOT') return false;
                    if(activeFilters.sort === 'best' && p.tag !== 'BEST') return false;
                }
                
                // Search filter
                if(activeFilters.search && !p.title.toLowerCase().includes(activeFilters.search)) return false;
                
                return true;
            });
            
            // Simple default UI Sort
            filtered.sort((a,b) => b.hearts - a.hearts);
            
            document.getElementById('marketCountLabel').innerHTML = `${filtered.length}개의 <span data-en="Footprints" data-ko="발자�?>Footprints</span>`;
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; padding:40px; text-align:center; color:#64748b; font-weight:700;"><span data-en="No matching search results." data-ko="조건??맞는 검??결과가 ?�습?�다.">No matching search results.</span></div>`;
                document.getElementById('paginationWrap').innerHTML = '';
                return;
            }

            // PAGINATION LOGIC
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if(currentPage > totalPages) currentPage = totalPages;
            if(currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageData = filtered.slice(startIdx, endIdx);

            pageData.forEach(p => {
                const _tagBg = { 'BEST': '#ED322B', 'NEW': '#025DD0', 'HOT': '#f97316' }[p.tag] || '#025DD0';
                const tagHtml = p.tag ? `<span class="card-img-tag" style="background:${_tagBg};">${p.tag}</span>` : '';
                
                const card = document.createElement('div');
                card.className = 'market-card';
                // ?�트�??�르�??�동 ?�함 ??target 체크 방식 (stopPropagation 보다 ?�정??
                card.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('card-heart')) {
                        goToDetail(p.id);
                    }
                });
                const pLabel = p.isFree ? '<span style="color:#22c55e;">FREE</span>' : p.price.toLocaleString() + ' KP';
                
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <span class="card-img-icon">${p.icon}</span>
                        ${p.tag ? `<span class="card-img-tag">${p.tag}</span>` : ''}
                        <span class="card-heart" data-id="${p.id}" style="color:#025DD0; font-size:19px; font-weight:900; cursor:pointer; padding:6px; line-height:1;">${p.isHearted ? '?? : '??}</span>
                    </div>
                    <div class="card-bottom">
                        <span class="card-name">${p.title}</span>
                        <span class="card-price">${pLabel}</span>
                    </div>
                `;
                // ?�트 ?�릭 ?�들??
                card.querySelector('.card-heart').addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleHeartFromList(p.id);
                });
                grid.appendChild(card);
            });
            
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            let wrap = document.getElementById('paginationWrap');
            if(!wrap) {
                wrap = document.createElement('div');
                wrap.id = 'paginationWrap';
                wrap.style.cssText = 'display:flex; justify-content:center; gap:8px; margin-top:40px; padding-bottom:40px;';
                document.getElementById('marketGridContainer').insertAdjacentElement('afterend', wrap);
            }
            wrap.innerHTML = '';
            for(let i=1; i<=totalPages; i++) {
                const btn = document.createElement('button');
                btn.style.cssText = `width: 36px; height: 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 800; cursor: pointer; transition: 0.2s; ${i===currentPage ? 'background:#1e3a8a; color:#fff; border-color:#1e3a8a;' : 'background:#fff; color:#475569;'}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderProducts(); window.scrollTo(0,0); };
                wrap.appendChild(btn);
            }
        }
        
        // Initial setup
        // updateSlider();
        
        // URL Parameter Handler for opening detail views from Index
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.market-panel').forEach(el => el.classList.remove('active'));
            // Default show detail panel
            document.getElementById('panel-detail').classList.add('active');

            const urlParams = new URLSearchParams(window.location.search);
            const detailId = urlParams.get('id') || urlParams.get('detail') || 1; 
            goToDetail(parseInt(detailId));
        });
    </script>
